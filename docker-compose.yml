version: "3.9"

services:
  web:
    build: .
    command: bash entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8005:8005"
    depends_on:
      - db

  db:
    image: postgres:12.0-alpine
    env_file: 
      - .env.db
    volumes:
      - postgres_bucrep3:/var/lib/postgresql/data

