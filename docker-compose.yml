version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB:       ${LOCAL_DB_NAME}
      POSTGRES_USER:     ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bucrep_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - bucrep_net

  # ── Django + Gunicorn ─────────────────────────────────────────────────────
  # Apache2 installé sur l'hôte fait le reverse proxy vers 127.0.0.1:8000
  web:
    build: .
    restart: always
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn bucrep.wsgi
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 300
               --access-logfile -
               --error-logfile -
               --log-level info"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/main/media
    depends_on:
      - db
      - redis
    networks:
      - bucrep_net

volumes:
  postgres_data:
  static_files:
  media_files:

networks:
  bucrep_net:
    driver: bridge
