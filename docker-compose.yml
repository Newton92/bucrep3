version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB:       ${LOCAL_DB_NAME}
      POSTGRES_USER:     ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bucrep_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - bucrep_net

  # ── Django + Gunicorn ─────────────────────────────────────────────────────
  web:
    build: .
    restart: always
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn bucrep.wsgi
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 300
               --access-logfile -
               --error-logfile -
               --log-level info"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/main/media
    depends_on:
      - db
      - redis
    networks:
      - bucrep_net

  # ── Nginx (reverse proxy) ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/bucrep.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/main/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - bucrep_net

  # ── Certbot (Let's Encrypt) ───────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Renouvellement automatique (lancé manuellement la 1ère fois)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  static_files:
  media_files:
  certbot_www:
  certbot_conf:

networks:
  bucrep_net:
    driver: bridge
