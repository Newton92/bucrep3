# ===========================================================================
# BUCREP — Espace privé / Dashboard + API
# Domaine : application.bucrep.net
# Proxy vers Gunicorn (Django) sur le port 8000
# ===========================================================================

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName application.bucrep.net

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── HTTPS ───────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName application.bucrep.net

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/application.bucrep.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/application.bucrep.net/privkey.pem
    Include               /etc/letsencrypt/options-ssl-apache.conf

    Alias /static/ /bucrep3/staticfiles/
    <Directory /bucrep3/staticfiles/>
        Require all granted
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
    </Directory>

    Alias /media/ /bucrep3/main/media/
    <Directory /bucrep3/main/media/>
        Require all granted
        Options -Indexes
    </Directory>

    # Proxy vers Gunicorn
    # IMPORTANT : Host forcé à application.bucrep.net → middleware Django
    #             autorise l'accès à /root-dashboard/, /api/, etc.
    ProxyPreserveHost Off
    RequestHeader set Host "application.bucrep.net"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    ProxyPass        /static/ !
    ProxyPass        /media/  !
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    LimitRequestBody 20971520

    ErrorLog  ${APACHE_LOG_DIR}/application_bucrep_net_error.log
    CustomLog ${APACHE_LOG_DIR}/application_bucrep_net_access.log combined
</VirtualHost>
