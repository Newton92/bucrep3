# ===========================================================================
# BUCREP — Site public / Vitrine SaaS
# Domaine : bucrep.net + www.bucrep.net
# Proxy vers Gunicorn (Django) sur le port 8000
# ===========================================================================

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName  bucrep.net
    ServerAlias www.bucrep.net

    # Laisser Certbot gérer .well-known pour la validation SSL
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/

    # Tout le reste → HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── HTTPS ───────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName  bucrep.net
    ServerAlias www.bucrep.net

    # SSL — certificats générés par Certbot
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/bucrep.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bucrep.net/privkey.pem
    Include               /etc/letsencrypt/options-ssl-apache.conf

    # Fichiers statiques et médias servis directement par Apache
    Alias /static/ /var/www/html/bucrep3/staticfiles/
    <Directory /var/www/html/bucrep3/staticfiles/>
        Require all granted
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
    </Directory>

    Alias /media/ /var/www/html/bucrep3/main/media/
    <Directory /var/www/html/bucrep3/main/media/>
        Require all granted
        Options -Indexes
    </Directory>

    # Proxy vers Gunicorn
    # IMPORTANT : Host forcé à bucrep.net → middleware Django applique les règles
    #             de la vitrine (bloque /root-dashboard/, /api/, etc.)
    ProxyPreserveHost Off
    RequestHeader set Host "bucrep.net"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    ProxyPass        /static/ !
    ProxyPass        /media/  !
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Taille max upload (avatars, documents)
    LimitRequestBody 20971520

    ErrorLog  ${APACHE_LOG_DIR}/bucrep_net_error.log
    CustomLog ${APACHE_LOG_DIR}/bucrep_net_access.log combined
</VirtualHost>
