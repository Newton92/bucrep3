{% load i18n humanize %}
<div class="modal fade" id="modal-view-actif-ifrs" tabindex="-1" aria-labelledby="modalViewActifIFRSLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalViewActifIFRSLabel">{% trans "Détail de l'Actif IFRS" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="modal-loader text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>
                <div class="modal-details-content" style="display: none;">
                    <div class="p-3 mb-3 bg-light rounded text-center">
                        <h6 class="mb-0 modal-title-period"></h6>
                    </div>
                    <table class="table table-sm table-striped">
                        <tbody class="details-table-body">
                            </tbody>
                        <tfoot class="table-group-divider">
                            <tr class="table-light">
                                <td class="fw-bold fs-5 text-uppercase">{% trans "Total Actif" %}</td>
                                <td class="text-end fw-bold fs-5 total-value"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Fermer" %}</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modal-edit-actif-ifrs" tabindex="-1" aria-labelledby="modalEditActifIFRSLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEditActifIFRSLabel">{% trans "Modifier l'Actif IFRS" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-edit-actif-ifrs">
                    {% csrf_token %}
                    <input type="hidden" id="edit-actif-ifrs-id" name="actif_id">
                    <div class="edit-form-content">
                        <div class="text-center p-5"><div class="spinner-border text-primary" role="status"></div></div>
                    </div>
                    <div class="modal-footer mt-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Annuler" %}</button>
                        <button type="submit" class="btn btn-primary" id="btn-save-actif-ifrs-changes"><i class="bi bi-save me-2"></i>{% trans "Enregistrer" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
