{% extends 'main/analyste/base.html' %}

{% load static %}

{% block css %}{% endblock %}

{% block body %}

<!-- Title START -->
<div class="row">
    <div class="col-12">
        <h3 class="fs-4 mb-0"><i class="bi bi-globe fa-fw me-1"></i>Articles</h3>
    </div>
</div>
<!-- Title END -->



<!-- COUNTRY START -->
<div class="row">
    <div class="col-12">
        <div class="card border rounded-3">
            <!-- Card header START -->
            <div class="card-header border-bottom">
                <h5 class="card-header-title">Liste des Articles</h5>
            </div>
            <!-- Card header END -->

            <!-- Card body START -->
            <div class="card-body">
                <h1>Gestion des articles</h1>

                <h2>Ajouter un article</h2>
                <form id="add-article-form">
                    <input type="text" id="titre" placeholder="Titre" required>
                    <textarea id="contenu" placeholder="Contenu" required></textarea>
                    <button type="submit">Ajouter</button>
                </form>

                <h2>Liste des articles</h2>
                <ul id="article-list"></ul>

                <div id="pagination">
                    <button id="prev-page">Précédent</button>
                    <span id="page-info"></span>
                    <button id="next-page">Suivant</button>
                </div>

                <h2>Rechercher un article</h2>
                <input type="text" id="search-query" placeholder="Rechercher par titre">
                <button id="search-button">Rechercher</button>

            </div>
            <!-- Card body END -->

            <!-- Card footer START -->
            <div class="card-footer pt-0">

            </div>
            <!-- Card footer END -->
        </div>
    </div>
</div>
<!-- COUNTRY END -->



{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;

    // Fonction pour obtenir le token JWT depuis localStorage
    function getToken() {
        return localStorage.getItem('access_token');
    }

    // Fonction pour vérifier si l'utilisateur est authentifié
    function checkAuth() {
        const token = getToken();
        if (!token) {
            alert('Vous devez vous connecter pour accéder à cette page.');
            window.location.href = '/'; // Rediriger vers la page de connexion
            return false;
        }
        return true;
    }

    // Lister les articles
    function loadArticles(page = 1) {
        if (!checkAuth()) return; // Vérifier l'authentification

        $.ajax({
            url: `/articles/?page=${page}`,
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + getToken() // Ajouter le token JWT
            },
            success: function(data) {
                $('#article-list').empty();
                data.results.forEach(function(article) {
                    $('#article-list').append(`
                        <li>
                            <strong>${article.titre}</strong> - ${article.contenu}
                            <button onclick="editArticle(${article.id})">Éditer</button>
                            <button onclick="deleteArticle(${article.id})">Supprimer</button>
                        </li>
                    `);
                });
                updatePagination(data);
            },
            error: function(xhr) {
                if (xhr.status === 401) {
                    alert('Token expiré ou invalide. Veuillez vous reconnecter.');
                    window.location.href = '/login/'; // Rediriger vers la page de connexion
                } else {
                    alert('Erreur lors du chargement des articles.');
                }
            }
        });
    }

    // Mettre à jour la pagination
    function updatePagination(data) {
        $('#page-info').text(`Page ${currentPage} sur ${data.total_pages}`);
        $('#prev-page').prop('disabled', !data.previous);
        $('#next-page').prop('disabled', !data.next);
    }

    // Ajouter un article
    $('#add-article-form').submit(function(e) {
        e.preventDefault();
        if (!checkAuth()) return; // Vérifier l'authentification

        $.ajax({
            url: '/articles/',
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + getToken() // Ajouter le token JWT
            },
            data: {
                titre: $('#titre').val(),
                contenu: $('#contenu').val()
            },
            success: function() {
                loadArticles(currentPage);
                $('#titre').val('');
                $('#contenu').val('');
            },
            error: function(xhr) {
                if (xhr.status === 401) {
                    alert('Token expiré ou invalide. Veuillez vous reconnecter.');
                    window.location.href = '/login/'; // Rediriger vers la page de connexion
                } else {
                    alert('Erreur lors de l\'ajout de l\'article.');
                }
            }
        });
    });

    // Éditer un article
    function editArticle(id) {
        if (!checkAuth()) return; // Vérifier l'authentification

        const newTitre = prompt('Nouveau titre:');
        const newContenu = prompt('Nouveau contenu:');
        if (newTitre && newContenu) {
            $.ajax({
                url: `/articles/${id}/`,
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + getToken() // Ajouter le token JWT
                },
                data: {
                    titre: newTitre,
                    contenu: newContenu
                },
                success: function() {
                    loadArticles(currentPage);
                },
                error: function(xhr) {
                    if (xhr.status === 401) {
                        alert('Token expiré ou invalide. Veuillez vous reconnecter.');
                        window.location.href = '/login/'; // Rediriger vers la page de connexion
                    } else {
                        alert('Erreur lors de la modification de l\'article.');
                    }
                }
            });
        }
    }

    // Supprimer un article
    function deleteArticle(id) {
        if (!checkAuth()) return; // Vérifier l'authentification

        if (confirm('Êtes-vous sûr de vouloir supprimer cet article ?')) {
            $.ajax({
                url: `/articles/${id}/`,
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + getToken() // Ajouter le token JWT
                },
                success: function() {
                    loadArticles(currentPage);
                },
                error: function(xhr) {
                    if (xhr.status === 401) {
                        alert('Token expiré ou invalide. Veuillez vous reconnecter.');
                        window.location.href = '/login/'; // Rediriger vers la page de connexion
                    } else {
                        alert('Erreur lors de la suppression de l\'article.');
                    }
                }
            });
        }
    }

    // Rechercher un article
    $('#search-button').click(function() {
        if (!checkAuth()) return; // Vérifier l'authentification

        const query = $('#search-query').val();
        $.ajax({
            url: '/articles/search/',
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + getToken() // Ajouter le token JWT
            },
            data: {
                q: query
            },
            success: function(data) {
                $('#article-list').empty();
                data.forEach(function(article) {
                    $('#article-list').append(`
                        <li>
                            <strong>${article.titre}</strong> - ${article.contenu}
                            <button onclick="editArticle(${article.id})">Éditer</button>
                            <button onclick="deleteArticle(${article.id})">Supprimer</button>
                        </li>
                    `);
                });
            },
            error: function(xhr) {
                if (xhr.status === 401) {
                    alert('Token expiré ou invalide. Veuillez vous reconnecter.');
                    window.location.href = '/login/'; // Rediriger vers la page de connexion
                } else {
                    alert('Erreur lors de la recherche des articles.');
                }
            }
        });
    });

    // Pagination précédente
    $('#prev-page').click(function() {
        if (currentPage > 1) {
            currentPage--;
            loadArticles(currentPage);
        }
    });

    // Pagination suivante
    $('#next-page').click(function() {
        currentPage++;
        loadArticles(currentPage);
    });

    // Charger les articles au démarrage
    $(document).ready(function() {
        loadArticles(currentPage);
    });
</script>
{% endblock %}
