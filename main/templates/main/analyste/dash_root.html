{% extends 'main/analyste/base.html' %}

{% load i18n %}
{% load static %}




{% block styles %}{% endblock %}


{% block body %}


<!-- Title START -->
<div class="row">
    <div class="col-12">
        <h3 class="fs-4 mb-0"><i class="bi bi-house fa-fw me-1"></i>Dashboard Analyste</h3>
    </div>
</div>
<!-- Title END -->

<!-- Counter START -->
<div class="row g-4">
    <!-- Counter item -->
    <div class="col-sm-6 col-xl-4">
        <div class="card card-body border">
            <div class="d-flex align-items-center">
                <!-- Icon -->
                <div class="icon-xl bg-success rounded-3 text-white">
                    <i class="bi bi-bag"></i>
                </div>
                <!-- Content -->
                <div class="ms-3">
                    <h4>0</h4>
                    <span>Commandes</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Counter item -->
    <div class="col-sm-6 col-xl-4">
        <div class="card card-body border">
            <div class="d-flex align-items-center">
                <!-- Icon -->
                <div class="icon-xl bg-info rounded-3 text-white">
                    <i class="bi bi-handbag"></i>
                </div>
                <!-- Content -->
                <div class="ms-3">
                    <h4>0</h4>
                    <span>Acheteurs</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Counter item -->
    <div class="col-sm-6 col-xl-4">
        <div class="card card-body border">
            <div class="d-flex align-items-center">
                <!-- Icon -->
                <div class="icon-xl bg-warning rounded-3 text-white">
                    <i class="bi bi-incognito"></i>
                </div>
                <!-- Content -->
                <div class="ms-3">
                    <h4>0</h4>
                    <span>Rapports</span>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Counter END -->

<!-- Graph START -->
<div class="row g-4">

    <!-- Booking graph START -->
    <div class="col-lg-12">
        <div class="card border h-100">
            <!-- Card header -->
            <div class="card-header border-bottom d-flex justify-content-between align-items-center">
                <h5 class="card-header-title">Commandes</h5>
            </div>
            <!-- Card body START -->
            <div class="card-body p-3">
                <!-- Chart -->
                <canvas id="commandesChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>
    <!-- Booking graph END -->

    <!-- Booking graph START -->
    <div class="col-lg-6">
        <div class="card border h-100">

            <!-- Card header -->
            <div class="card-header border-bottom d-flex justify-content-between align-items-center">
                <h5 class="card-header-title">Acheteurs</h5>
                <a href="#" class="btn btn-link p-0 mb-0"></a>
            </div>

            <!-- Card body START -->
            <div class="card-body p-3">
                <!-- Chart -->
                <canvas id="acheteursChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>
    <!-- Booking graph END -->

    <!-- Booking graph START -->
    <div class="col-lg-6">
        <div class="card shadow h-100">
            <!-- Card header -->
            <div class="card-header border-bottom">
                <h5 class="card-header-title">Alertes</h5>
            </div>

            <!-- Card body START -->
            <div class="card-body p-3">
                <!-- Chart -->
                <canvas id="alertesChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>
    <!-- Booking graph END -->

</div>
<!-- Graph END -->



{% endblock %}


{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
        // Récupérer les données des acheteurs
        fetch('/api/acheteurs-par-mois/')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('acheteursChart').getContext('2d');
                const acheteursChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Nombre d\'acheteurs créés par mois',
                            data: data.data,
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });

        // Récupérer les données des AlerteLogs
        fetch('/api/alertelogs-par-mois/')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('alertelogsChart').getContext('2d');
                const alertelogsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Nombre d\'AlerteLogs créées par mois',
                            data: data.data,
                            backgroundColor: 'rgba(153, 102, 255, 0.2)',
                            borderColor: 'rgba(153, 102, 255, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });

        // Récupérer les données des Commandes
        fetch('/api/commandes-par-mois/')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('commandesChart').getContext('2d');
                const commandesChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Nombre de commandes créées par mois',
                            data: data.data,
                            backgroundColor: 'rgba(255, 159, 64, 0.2)',
                            borderColor: 'rgba(255, 159, 64, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });


        // Récupérer les données des alertes
        fetch('/api/alertes-par-mois/')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('alertesChart').getContext('2d');
                const alertesChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Nombre d\'alertes créées par mois',
                            data: data.data,
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });
    </script>
{% endblock %}
