{% load i18n static custom_filters %}
<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Solvency Report</title>
      <style>
         /* Styles pour WeasyPrint (identiques à la version française) */
         @media screen {
            .container {
                padding: 20px;
                max-width: 1200px; /* Limiter la largeur sur écran */
                margin: 0 auto;
            }
        }
         @page {
            size: A4;
            margin: 15mm 10mm 20mm 10mm; /* Ces marges s'appliquent à la page PDF */
            @bottom-left {
                content: "Our information is confidential and may not be disclosed under penalty of damages.";
                font-size: 8pt;
                color: #666;
            }
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-size: 8pt;
                color: #666;
            }
        }
         @bottom-right {
         content: "Page " counter(page) " of " counter(pages);
         font-size: 8pt;
         color: #666;
         }
         body {
         font-family: Arial, sans-serif;
         font-size: 10pt;
         line-height: 1.4;
         color: #000;
         margin: 0;
         padding: 0;
         background-color: #ffffff;
         }
         .container {
         width: 100%;
         margin: 0 auto;
         }
         /* the rest of the template should mirror report_html_standalone_pdf.html
            with all French text replaced by English equivalents. */
      </style>
   </head>
   <body>
      <!-- content copied from original; translate static French strings -->
      {{ report_data|safe }}
   </body>
</html>
