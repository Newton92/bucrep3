{% load i18n %}
{% load static %}

<!DOCTYPE html>
<html lang="en">


<!-- ACREMAC | Bucrep 3.0 -->
<head>
    <title>BUCREP - Login</title>

    <!-- Meta Tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Webestica.com">
    <meta name="description" content="Bucrep - Multipurpose Online Booking Theme">

    <!-- Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Import Vue.js via CDN -->

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/bucrep-image.png' %}">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap">

    <!-- Plugins CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'assets/vendor/font-awesome/css/all.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <!-- Theme CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'assets/css/style.css' %}">

    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.4.24/sweetalert2.min.css">

    <style>
        .goog-te-banner-frame.skiptranslate {display: none !important;}
        body {top: 0px !important;}
    </style>

    <style>
      /* Supprime le bandeau bleu Google */
      .goog-te-banner-frame.skiptranslate {display: none !important;}
      body {top: 0px !important;}
      #google_translate_element {display: none;} /* Cache le widget original */

      /* Drapeaux */
      .flag-icon {
        width: 28px;
        height: 20px;
        cursor: pointer;
        margin-left: 8px;
        border: 1px solid #ccc;
        border-radius: 3px;
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }

      .flag-icon:hover {
        transform: scale(1.1);
        box-shadow: 0 0 8px rgba(0,0,0,0.2);
      }

      /* Drapeau actif */
      .flag-active {
        border-color: #facc15 !important; /* jaune */
        box-shadow: 0 0 10px rgba(250, 204, 21, 0.7);
        transform: scale(1.1);
        animation: pulse 1.5s infinite;
      }

      /* Animation pulsation */
      @keyframes pulse {
        0% { box-shadow: 0 0 8px rgba(250, 204, 21, 0.7); }
        50% { box-shadow: 0 0 15px rgba(250, 204, 21, 1); }
        100% { box-shadow: 0 0 8px rgba(250, 204, 21, 0.7); }
      }
    </style>

    <style>
    /* Supprime la barre Google et ajuste la position du body */
    .goog-te-banner-frame.skiptranslate { 
        display: none !important; 
    }
    body { 
        top: 0px !important; 
    }

    /* Masque le menu Google Translate (le sélecteur natif) */
    #goog-gt-tt, .goog-te-balloon-frame, .goog-tooltip {
        display: none !important;
    }

    /* Empêche Google de forcer une couleur de fond */
    .goog-text-highlight { 
        background: none !important; 
        box-shadow: none !important; 
    }

    /* Masque la boîte de traduction contextuelle */
    .goog-te-gadget { 
        display: none !important; 
    }
    </style>

</head>

<body>
    <!-- Vue.js App -->
    <div id="app">

        <!-- **************** MAIN CONTENT START **************** -->
        <main>

            <!-- =======================
            Main Content START -->
            <section class="vh-xxl-100">
                <div class="container h-100 d-flex px-0 px-sm-4">
                    <div class="row justify-content-center align-items-center m-auto">
                        <div class="col-12">
                            <div class="bg-mode shadow rounded-3 overflow-hidden">
                                <div class="row g-0">
                                    <!-- Vector Image -->
                                    <div class="col-lg-6 d-flex align-items-center order-2 order-lg-1">
                                        <div class="p-3 p-lg-5">
                                            <img src="{% static 'assets/images/login-bucrep.png' %}" alt="">
                                        </div>
                                        <!-- Divider -->
                                        <div class="vr opacity-1 d-none d-lg-block"></div>
                                    </div>

                                    <!-- Information -->
                                    <div class="col-lg-6 order-1">
                                        <div class="p-4 p-sm-7">
                                            <!-- Logo -->
                                            <a href="{% url 'index' %}">
                                                <img class="h-50px mb-4" src="{% static 'assets/images/bucrep-image.png' %}" alt="logo">
                                            </a>
                                            <!-- Title -->
                                            <h1 class="mb-2 h3" style="color: #0A95CA;">{% trans "CONNEXION" %}</h1>
                                            <p class="mb-0">{% trans "Accédez à votre" %} <a href="#" style="color: #0A95CA;">{% trans "espace privé" %}</a> !</p>

                                            <!-- Form START -->
                                            <form id="loginForm" class="mt-4 text-start">
                                                <!-- Username -->
                                                <div class="mb-3">
                                                    <label class="form-label">{% trans "Pseudo" %}</label>
                                                    <input type="text" class="form-control" id="username" name="username" placeholder="John DOE" required>
                                                </div>
                                                <!-- Password -->
                                                <div class="mb-3 position-relative">
                                                    <label class="form-label">{% trans "Mot de Passe" %}</label>
                                                    <input class="form-control fakepassword" type="password" id="password" name="password" required>
                                                    <span class="position-absolute top-50 end-0 translate-middle-y p-0 mt-3">
                                                        <i class="fakepasswordicon bi bi-eye-slash cursor-pointer p-2"></i>
                                                    </span>
                                                </div>
                                                <!-- Remember me -->
                                                <div class="mb-3 d-sm-flex justify-content-between">
                                                    <div></div>
                                                    <a href="{% url 'forgot_auth' %}" style="color: #0A95CA;">{% trans "Mot de passe oublié" %} ?</a>
                                                </div>
                                                <!-- Button -->
                                                <div>
                                                    <button type="submit" class="btn btn-primary w-100 mb-0" style="background-color: #0A95CA; border-color: #0A95CA;">
                                                        {% trans "connexion" %}
                                                    </button>
                                                </div>

                                                <br>

                                                <!-- Divider -->
                                                <div class="position-relative my-4">
                                                    <hr>
                                                    <p class="small bg-mode position-absolute top-50 start-50 translate-middle px-2">BUCREP 3.0</p>
                                                </div>

                                                <!-- Copyright -->
                                                <div class="text-primary-hover text-body mt-3 text-center"> Copyrights ©2025. {% trans "Conçu par" %} <a href="https://www.acremac.com/" class="text-body">ACREMAC</a>. </div>

                                                <!-- Translation -->
                                                <!-- Formulaire de changement de langue -->
                                                <form id="language-form" action="{% url 'set_language' %}" method="post">
                                                    {% csrf_token %}
                                                    <input type="hidden" name="next" value="{{ request.path }}">
                                                    <input type="hidden" id="language-input" name="language">
                                                </form>

                                                <!-- Drapeaux de sélection de langue -->
                                                <div class="text-primary-hover text-body mt-3 text-center">
                                                    <a href="#" class="lang-flag" data-lang="fr">
                                                        <img height="30" width="25" src="{% static 'assets/images/french.png' %}" id="flag-fr" alt="Français">
                                                    </a>
                                                    &nbsp;
                                                    <a href="#" class="lang-flag" data-lang="en">
                                                        <img height="30" width="27" src="{% static 'assets/images/english.png' %}" id="flag-en" alt="Anglais">
                                                    </a>
                                                </div>







                                            </form>
                                            <!-- Form END -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- =======================
            Main Content END -->

        </main>
        <!-- **************** MAIN CONTENT END **************** -->

    </div>

    
     <!-- Élément caché Google Translate -->
    <div id="google_translate_element" style="display: none;"></div>

    <!-- Back to top -->
    <div class="back-top"></div>

    <!-- Bootstrap JS -->
    <script src="{% static 'assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>

    <!-- ThemeFunctions -->
    <script src="{% static 'assets/js/functions.js' %}"></script>

    <!-- SweetAlert JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.4.24/sweetalert2.all.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


    <!-- Ajax Script -->
    <script>
        $(document).ready(function() {
            $('#loginForm').on('submit', function(event) {
                event.preventDefault();
                var username = $('#username').val();
                var password = $('#password').val();

                // Validation des champs
                if (!username || !password) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Veuillez remplir tous les champs.',
                    });
                    return;
                }

                // Appel AJAX pour authentification
                $.ajax({
                    url: '/api/login/',
                    type: 'POST',
                    data: JSON.stringify({ username: username, password: password }),
                    contentType: 'application/json',
                    success: function(response) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Succès',
                            /*text: 'Un code de connexion a été envoyé à votre adresse email.',*/
                            text: 'Authentification réussie. Redirection en cours...',
                            showConfirmButton: false,
                            timer: 1500
                        }).then(() => {
                            // Rediriger vers l'URL contenant le token
                            if (response.reset_url) {
                                // IMPORTANT : Stocker le token dans le localStorage pour le récupérer plus tard
                                localStorage.setItem('access_token', response.access);
                                localStorage.setItem('refresh_token', response.refresh);

                                // Rediriger vers l'URL pour la 2FA
                                window.location.href = response.reset_url;
                            } else {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Erreur',
                                    text: 'URL de redirection introuvable.',
                                });
                            }
                        });
                    },
                    error: function(response) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Oops...',
                            text: 'Vos identifiants sont invalides.',
                        });
                    }
                });
            });
        });
    </script>

    <script>
    $(document).ready(function () {
        $(".lang-flag").click(function (e) {
            e.preventDefault(); // Empêche le rechargement immédiat

            var lang = $(this).data("lang"); // Récupère la langue sélectionnée
            var url = $("#language-form").attr("action"); // URL du formulaire
            var csrfToken = $("input[name=csrfmiddlewaretoken]").val(); // Token CSRF

            $.ajax({
                type: "POST",
                url: url,
                data: {
                    language: lang,
                    csrfmiddlewaretoken: csrfToken
                },
                success: function () {
                    console.log("Langue changée avec succès !");
                    Swal.fire({
                        title: "Succès",
                        text: "Langue changée avec succès.",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        location.reload(true); // Recharge la page après le changement de langue
                    });
                },
                error: function () {
                    Swal.fire({
                        title: "Erreur",
                        text: "Impossible de changer la langue.",
                        icon: "error"
                    });
                }
            });
        });
    });


    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'fr',
                includedLanguages: 'en,fr',
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // Fonction pour masquer la barre Google Translate (Bandeau bleu)
        function hideGoogleToolbar() {
            const toolbar = document.querySelector('.goog-te-banner-frame.skiptranslate');
            if (toolbar) {
                toolbar.style.display = 'none';
            }
            // S'assurer que le <body> n'a pas de padding-top
            document.body.style.top = '0px';
        }

        document.addEventListener("DOMContentLoaded", function () {
            const flags = {
                fr: document.getElementById("flag-fr"),
                en: document.getElementById("flag-en")
            };

            let currentLang = localStorage.getItem('site_lang') || "fr";

            function updateActiveFlag(lang) {
                Object.keys(flags).forEach(code => {
                    if (flags[code]) flags[code].classList.toggle("flag-active", code === lang);
                });
            }

            function waitForGoogleCombo(maxRetries = 20, interval = 250) {
                return new Promise((resolve, reject) => {
                    let tries = 0;
                    const timer = setInterval(() => {
                        const combo = document.querySelector(".goog-te-combo");
                        if (combo) {
                            clearInterval(timer);
                            resolve(combo);
                        } else {
                            tries++;
                            if (tries >= maxRetries) {
                                clearInterval(timer);
                                reject(new Error("google-combo-not-found"));
                            }
                        }
                    }, interval);
                });
            }

            async function applyLanguage(lang) {
                try {
                    const combo = await waitForGoogleCombo(40, 250);
                    
                    // 1. Déclenche la traduction
                    combo.value = lang;
                    const event = new Event('change', { bubbles: true });
                    combo.dispatchEvent(event);

                    // 2. Masque la barre immédiatement après le changement
                    // Note: Le délai est essentiel car le changement est asynchrone
                    setTimeout(() => {
                        hideGoogleToolbar();
                    }, 50); // Petit délai pour laisser Google commencer la traduction

                    // 3. Mise à jour UI et stockage
                    currentLang = lang;
                    localStorage.setItem('site_lang', lang);
                    updateActiveFlag(lang);

                } catch (err) {
                    Swal.fire({
                        icon: "warning",
                        title: "Traduction non prête",
                        text: "Le traducteur Google n'est pas encore chargé. Réessayez dans quelques secondes.",
                        confirmButtonColor: "#3085d6",
                        confirmButtonText: "OK"
                    });
                }
            }

            // Attache les événements aux drapeaux
            if (flags.fr) flags.fr.addEventListener("click", () => applyLanguage("fr"));
            if (flags.en) flags.en.addEventListener("click", () => applyLanguage("en"));

            // Initialise le visuel
            updateActiveFlag(currentLang);

            // Tente d'appliquer la langue mémorisée au chargement initial
            if (currentLang && currentLang !== "fr") {
                setTimeout(() => applyLanguage(currentLang), 800);
            }


            // 🚨 Solution Persistante : Vérifie toutes les 500ms si la barre est revenue et la masque
            setInterval(hideGoogleToolbar, 500);
        });
    </script>





</body>

<!-- ACREMAC | Bucrep 3.0 -->
</html>
