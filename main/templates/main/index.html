{% load i18n %}
{% load static %}

<!DOCTYPE html>
<html lang="en">


<!-- ACREMAC | Bucrep 3.0 -->
<head>
    <title>BUCREP - Login</title>

    <!-- Meta Tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Webestica.com">
    <meta name="description" content="Bucrep - Multipurpose Online Booking Theme">

    <!-- Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Import Vue.js via CDN -->

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/bucrep-image.png' %}">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap">

    <!-- Plugins CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'assets/vendor/font-awesome/css/all.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <!-- Theme CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'assets/css/style.css' %}">

    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.4.24/sweetalert2.min.css">
</head>

<body>
    <!-- Vue.js App -->
    <div id="app">

        <!-- **************** MAIN CONTENT START **************** -->
        <main>

            <!-- =======================
            Main Content START -->
            <section class="vh-xxl-100">
                <div class="container h-100 d-flex px-0 px-sm-4">
                    <div class="row justify-content-center align-items-center m-auto">
                        <div class="col-12">
                            <div class="bg-mode shadow rounded-3 overflow-hidden">
                                <div class="row g-0">
                                    <!-- Vector Image -->
                                    <div class="col-lg-6 d-flex align-items-center order-2 order-lg-1">
                                        <div class="p-3 p-lg-5">
                                            <img src="{% static 'assets/images/login-bucrep.png' %}" alt="">
                                        </div>
                                        <!-- Divider -->
                                        <div class="vr opacity-1 d-none d-lg-block"></div>
                                    </div>

                                    <!-- Information -->
                                    <div class="col-lg-6 order-1">
                                        <div class="p-4 p-sm-7">
                                            <!-- Logo -->
                                            <a href="{% url 'index' %}">
                                                <img class="h-50px mb-4" src="{% static 'assets/images/bucrep-image.png' %}" alt="logo">
                                            </a>
                                            <!-- Title -->
                                            <h1 class="mb-2 h3" style="color: #0A95CA;">{% trans "CONNEXION" %}</h1>
                                            <p class="mb-0">{% trans "Accédez à votre" %} <a href="#" style="color: #0A95CA;">{% trans "espace privé" %}</a> !</p>

                                            <!-- Form START -->
                                            <form id="loginForm" class="mt-4 text-start">
                                                <!-- Username -->
                                                <div class="mb-3">
                                                    <label class="form-label">{% trans "Pseudo" %}</label>
                                                    <input type="text" class="form-control" id="username" name="username" placeholder="John DOE" required>
                                                </div>
                                                <!-- Password -->
                                                <div class="mb-3 position-relative">
                                                    <label class="form-label">{% trans "Mot de Passe" %}</label>
                                                    <input class="form-control fakepassword" type="password" id="password" name="password" required>
                                                    <span class="position-absolute top-50 end-0 translate-middle-y p-0 mt-3">
                                                        <i class="fakepasswordicon bi bi-eye-slash cursor-pointer p-2"></i>
                                                    </span>
                                                </div>
                                                <!-- Remember me -->
                                                <div class="mb-3 d-sm-flex justify-content-between">
                                                    <div></div>
                                                    <a href="{% url 'forgot_auth' %}" style="color: #0A95CA;">{% trans "Mot de passe oublié" %} ?</a>
                                                </div>
                                                <!-- Button -->
                                                <div>
                                                    <button type="submit" class="btn btn-primary w-100 mb-0" style="background-color: #0A95CA; border-color: #0A95CA;">
                                                        {% trans "connexion" %}
                                                    </button>
                                                </div>

                                                <br>

                                                <!-- Divider -->
                                                <div class="position-relative my-4">
                                                    <hr>
                                                    <p class="small bg-mode position-absolute top-50 start-50 translate-middle px-2">BUCREP 3.0</p>
                                                </div>

                                                <!-- Copyright -->
                                                <div class="text-primary-hover text-body mt-3 text-center"> Copyrights ©2025. {% trans "Conçu par" %} <a href="https://www.acremac.com/" class="text-body">ACREMAC</a>. </div>

                                                <!-- Translation -->
                                                <!-- Formulaire de changement de langue -->
                                                <form id="language-form" action="{% url 'set_language' %}" method="post">
                                                    {% csrf_token %}
                                                    <input type="hidden" name="next" value="{{ request.path }}">
                                                    <input type="hidden" id="language-input" name="language">
                                                </form>

                                                <!-- Drapeaux de sélection de langue -->
                                                <div class="text-primary-hover text-body mt-3 text-center">
                                                    <a href="#" class="lang-flag" data-lang="fr">
                                                        <img height="30" width="25" src="{% static 'assets/images/french.png' %}" alt="Français">
                                                    </a>
                                                    &nbsp;
                                                    <a href="#" class="lang-flag" data-lang="en">
                                                        <img height="30" width="27" src="{% static 'assets/images/english.png' %}" alt="Anglais">
                                                    </a>
                                                </div>







                                            </form>
                                            <!-- Form END -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- =======================
            Main Content END -->

        </main>
        <!-- **************** MAIN CONTENT END **************** -->

    </div>

<!-- Back to top -->
<div class="back-top"></div>

<!-- Bootstrap JS -->
<script src="{% static 'assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>

<!-- ThemeFunctions -->
<script src="{% static 'assets/js/functions.js' %}"></script>

<!-- SweetAlert JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.4.24/sweetalert2.all.min.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


<!-- Ajax Script -->
<script>
    $(document).ready(function() {
        $('#loginForm').on('submit', function(event) {
            event.preventDefault();
            var username = $('#username').val();
            var password = $('#password').val();

            // Validation des champs
            if (!username || !password) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Veuillez remplir tous les champs.',
                });
                return;
            }

            // Appel AJAX pour authentification
            $.ajax({
                url: '/api/login/',
                type: 'POST',
                data: JSON.stringify({ username: username, password: password }),
                contentType: 'application/json',
                success: function(response) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Succès',
                        text: 'Un code de connexion a été envoyé à votre adresse email.',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        // Rediriger vers l'URL contenant le token
                        if (response.reset_url) {
                            window.location.href = response.reset_url;
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Erreur',
                                text: 'URL de redirection introuvable.',
                            });
                        }
                    });
                },
                error: function(response) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Vos identifiants sont invalides.',
                    });
                }
            });
        });
    });
</script>

<script>
$(document).ready(function () {
    $(".lang-flag").click(function (e) {
        e.preventDefault(); // Empêche le rechargement immédiat

        var lang = $(this).data("lang"); // Récupère la langue sélectionnée
        var url = $("#language-form").attr("action"); // URL du formulaire
        var csrfToken = $("input[name=csrfmiddlewaretoken]").val(); // Token CSRF

        $.ajax({
            type: "POST",
            url: url,
            data: {
                language: lang,
                csrfmiddlewaretoken: csrfToken
            },
            success: function () {
                console.log("Langue changée avec succès !");
                Swal.fire({
                    title: "Succès",
                    text: "Langue changée avec succès.",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    location.reload(true); // Recharge la page après le changement de langue
                });
            },
            error: function () {
                Swal.fire({
                    title: "Erreur",
                    text: "Impossible de changer la langue.",
                    icon: "error"
                });
            }
        });
    });
});


</script>





</body>

<!-- ACREMAC | Bucrep 3.0 -->
</html>
