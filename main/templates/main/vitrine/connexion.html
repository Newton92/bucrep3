{% extends 'main/vitrine/base.html' %}

{% load i18n static %}


{% block styles %}
<style>
            body {
                font-family: "Inter", sans-serif;
            }
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
        </style>
{% endblock %}

{% block body %}


<main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[480px] space-y-8">
        <div class="text-center space-y-2">
            <h1 style="color: #25ADD6;" class="text-3xl font-bold tracking-tight text-slate-900 primary:text-primary">Connexion</h1>
            <p class="text-slate-600 dark:text-slate-400">Heureux de vous revoir sur la plateforme</p>
        </div>
        <div
            class="bg-white dark:bg-slate-900 p-8 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800"
        >
            <form class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Email</label>
                    <div class="relative">
                        <input
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                            placeholder="votre@email.com"
                            required=""
                            type="email"
                        />
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300"
                            >Mot de passe</label
                        >
                        <a class="text-sm font-medium text-primary hover:underline" href="{% url 'forgot_password' %}"
                            >Mot de passe oublié ?</a
                        >
                    </div>
                    <div class="relative flex items-center">
                        <input
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all pr-12"
                            placeholder="••••••••"
                            required=""
                            type="password"
                        />
                        <button
                            class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                            type="button"
                        >
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <input
                        class="rounded border-slate-300 text-primary focus:ring-primary"
                        id="remember"
                        type="checkbox"
                    />
                    <label class="text-sm text-slate-600 dark:text-slate-400" for="remember"
                        >Se souvenir de moi</label
                    >
                </div>
                <button
                    class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-lg transition-colors shadow-md shadow-primary/20"
                    type="submit"
                >
                    Se connecter
                </button>
            </form>
            <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
                <p class="text-slate-600 dark:text-slate-400">
                    Pas encore de compte ?
                    <a class="text-primary font-bold hover:underline" href="{% url 'registration' %}">S'inscrire</a>
                </p>
            </div>
        </div>
        <div class="text-center">
            <p class="text-sm text-slate-500 dark:text-slate-500">
                Un produit <span class="font-semibold text-slate-700 dark:text-slate-300">ACREMAC</span>
            </p>
        </div>
    </div>
</main>


{% endblock %}

{% block scripts %}{% endblock %}
