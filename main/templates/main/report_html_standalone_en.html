{% load static custom_filters %}
<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Solvency Report</title>
      <style>
         /* Styles pour WeasyPrint (identiques à la version française) */
         @media screen {
            .container {
                padding: 20px;
                max-width: 1200px; /* Limiter la largeur sur écran */
                margin: 0 auto;
            }
        }
         @page {
            size: A4;
            margin: 15mm 10mm 20mm 10mm; /* Ces marges s'appliquent à la page PDF */
            @bottom-left {
                content: "Our information is confidential and may not be disclosed under penalty of damages.";
                font-size: 8pt;
                color: #666;
            }
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-size: 8pt;
                color: #666;
            }
        }
         @bottom-right {
         content: "Page " counter(page) " of " counter(pages);
         font-size: 8pt;
         color: #666;
         }
         body {
            font-family: Arial, sans-serif;
            font-size: 10pt;
            line-height: 1.4;
            color: #000;
            margin: 0;
            padding: 10px; /* Marges internes dans le corps */
            background-color: #ffffff;
        }
         .container {
         width: 100%;
         margin: 0 auto;
         }
         /* remainder of the template is identical to the french version
            but all static French labels should be translated to English.
            You can copy the rest of main/report_html_standalone.html and
            replace the strings accordingly, or keep using Django i18n. */
      </style>
   </head>
   <body>
      <!-- content goes here, translate the section headers etc. -->
      {% comment %} copied structure from report_html_standalone.html {% endcomment %}
      {{ report_data|safe }}
   </body>
</html>
