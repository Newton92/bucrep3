<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre Warning</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center" valign="top" style="background-color: #ffffff; margin: 20px auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); max-width: 600px;">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td align="center" style="text-align: center; margin-bottom: 20px;">
                            <h1 style="color: #0A95CA; margin: 0; font-size: 24px;">{{ alerte.objet }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="margin-bottom: 20px; font-size: 16px; line-height: 1.5; color: #1f3864;">
                            <p style="margin: 0 0 10px 0;">{{ alerte.content|safe }}</p>
                        </td>
                    </tr>
                    <br><br>
                    <tr>
                        <td style="background-color: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 4px; margin-bottom: 20px;">
                            <p style="margin: 0 0 10px 0; font-size: 16px; line-height: 1.5; color: #1f3864;">Liste des liens des documents :</p>
                            <ul style="list-style-type: none; padding: 0; margin: 0;">
                                {% for doc in alerte.documents_alerte.all %}
                                <li style="margin-bottom: 5px;">
                                    <a href="{{ doc.fichier.url }}" target="_blank" style="color: #0A95CA; text-decoration: none;">{{ doc.titre }}</a>
                                </li>
                                {% endfor %}
                            </ul>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: center; font-size: 12px; color: #888; margin-top: 20px;">
                            <p style="margin: 0;">© 2025 BUCREP . ACREMAC . Tous droits réservés.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
