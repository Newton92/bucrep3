<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de réinitialisation du mot de passe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            background-color: #ffffff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #0A95CA;
        }
        .content {
            margin-bottom: 20px;
        }
        .content p {
            font-size: 16px;
            line-height: 1.5;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BUCREP - Confirmation de réinitialisation du mot de passe</h1>
        </div>
        <div class="content">
            <p>Bonjour {{ user.first_name }},</p>
            <p>Votre mot de passe a été réinitialisé avec succès.</p>
            <p>Si vous n'êtes pas à l'origine de cette opération, veuillez contacter le webmaster immédiatement.</p>
        </div>
        <div class="footer">
            <p>© 2025 BUCREP . ACREMAC . Tous droits réservés.</p>
        </div>
    </div>
</body>
</html>
