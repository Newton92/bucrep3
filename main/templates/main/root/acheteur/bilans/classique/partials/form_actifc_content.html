<div class="accordion-item">
    <h2 class="accordion-header" id="headingActifC{{ suffix }}">
        <button class="accordion-button {% if suffix != 'n' %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapseActifC{{ suffix }}" aria-expanded="{% if suffix == 'n' %}true{% else %}false{% endif %}" aria-controls="collapseActifC{{ suffix }}">
            <strong>Actif pour l'année {{ suffix|upper }}</strong>
        </button>
    </h2>
    <div id="collapseActifC{{ suffix }}" class="accordion-collapse collapse {% if suffix == 'n' %}show{% endif %}" aria-labelledby="headingActifC{{ suffix }}" data-bs-parent="#accordionActifsC">
        <div class="accordion-body">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="annee_{{ suffix }}" class="form-label">Année</label>
                    <select name="annee_{{ suffix }}" id="annee_{{ suffix }}" class="form-select">
                        <option selected disabled value="">Sélectionner...</option>
                        {% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            
            <h5 class="mt-1"><i class="bi bi-person-fill"></i> {{ acheteur.nom }}</h5>
            <hr>

            <h4 class="text-primary mt-4">ACTIF IMMOBILISÉ</h4>
            <h6 class="text-muted mt-3 mb-2">Éléments Incorporels</h6>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="frais_recherche_developpement_{{ suffix }}" class="form-label mb-0">Frais recherche & développement</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-incorporel-input-{{ suffix }}" name="frais_recherche_developpement_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="brevet_licence_logiciels_{{ suffix }}" class="form-label mb-0">Brevet, licence, logiciels</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-incorporel-input-{{ suffix }}" name="brevet_licence_logiciels_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="fonds_commercial_{{ suffix }}" class="form-label mb-0">Fonds commercial</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-incorporel-input-{{ suffix }}" name="fonds_commercial_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="autres_immobilisations_incorporelles_{{ suffix }}" class="form-label mb-0">Autres immobilisations incorporelles</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-incorporel-input-{{ suffix }}" name="autres_immobilisations_incorporelles_{{ suffix }}" value="0"></div>
            </div>

            <h6 class="text-muted mt-3 mb-2">Éléments Corporels</h6>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="terrains_{{ suffix }}" class="form-label mb-0">Terrains</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-corporel-input-{{ suffix }}" name="terrains_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="constructions_{{ suffix }}" class="form-label mb-0">Constructions</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-corporel-input-{{ suffix }}" name="constructions_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="materiels_et_outils_{{ suffix }}" class="form-label mb-0">Matériels et outils</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-corporel-input-{{ suffix }}" name="materiels_et_outils_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="materiel_de_transport_{{ suffix }}" class="form-label mb-0">Matériel de transport</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-corporel-input-{{ suffix }}" name="materiel_de_transport_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="autres_immos_corp_{{ suffix }}" class="form-label mb-0">Autres immos corporelles</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-corporel-input-{{ suffix }}" name="autres_immos_corp_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="immos_en_cours_{{ suffix }}" class="form-label mb-0">Immos en cours</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-corporel-input-{{ suffix }}" name="immos_en_cours_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="avances_et_acptes_{{ suffix }}" class="form-label mb-0">Avances et acomptes</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-corporel-input-{{ suffix }}" name="avances_et_acptes_{{ suffix }}" value="0"></div>
            </div>
            
            <h6 class="text-muted mt-3 mb-2">Éléments Financiers</h6>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="participations_{{ suffix }}" class="form-label mb-0">Participations</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-financier-input-{{ suffix }}" name="participations_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="prets_{{ suffix }}" class="form-label mb-0">Prêts</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-financier-input-{{ suffix }}" name="prets_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="autres_{{ suffix }}" class="form-label mb-0">Autres</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-financier-input-{{ suffix }}" name="autres_{{ suffix }}" value="0"></div>
            </div>

            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_I_{{ suffix }}" class="form-label fw-bold mb-0">TOTAL ACTIF IMMOBILISÉ</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_I_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>
            
            <h4 class="text-primary mt-4">ACTIF CIRCULANT</h4>
            <h6 class="text-muted mt-3 mb-2">Stocks</h6>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="stocks_mp_{{ suffix }}" class="form-label mb-0">Stocks de matières premières</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-stocks-input-{{ suffix }}" name="stocks_mp_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="stocks_encours_mp_{{ suffix }}" class="form-label mb-0">Stocks encours MP</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-stocks-input-{{ suffix }}" name="stocks_encours_mp_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="stocks_pf_{{ suffix }}" class="form-label mb-0">Stocks de produits finis</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-stocks-input-{{ suffix }}" name="stocks_pf_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="stocks_encours_pf_{{ suffix }}" class="form-label mb-0">Stocks encours PF</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-stocks-input-{{ suffix }}" name="stocks_encours_pf_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="stocks_encours_services_{{ suffix }}" class="form-label mb-0">Stocks encours services</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-stocks-input-{{ suffix }}" name="stocks_encours_services_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="stocks_mses_{{ suffix }}" class="form-label mb-0">Stocks de marchandises</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-stocks-input-{{ suffix }}" name="stocks_mses_{{ suffix }}" value="0"></div>
            </div>
            
            <h6 class="text-muted mt-3 mb-2">Créances</h6>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="avances_acptes_verses_{{ suffix }}" class="form-label mb-0">Avances et acomptes versés</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-creances-input-{{ suffix }}" name="avances_acptes_verses_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="clients_et_cptes_rattaches_{{ suffix }}" class="form-label mb-0">Clients et comptes rattachés</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-creances-input-{{ suffix }}" name="clients_et_cptes_rattaches_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="autres_creances_{{ suffix }}" class="form-label mb-0">Autres créances</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-creances-input-{{ suffix }}" name="autres_creances_{{ suffix }}" value="0"></div>
            </div>

            <h6 class="text-muted mt-3 mb-2">Disponibilités & VMP</h6>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="valeurs_a_encaisser_{{ suffix }}" class="form-label mb-0">Valeurs à encaisser</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-dispos-input-{{ suffix }}" name="valeurs_a_encaisser_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="banques_cheques_postaux_caisse_{{ suffix }}" class="form-label mb-0">Banques, chèques postaux, caisse</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-dispos-input-{{ suffix }}" name="banques_cheques_postaux_caisse_{{ suffix }}" value="0"></div>
            </div>

            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_II_{{ suffix }}" class="form-label fw-bold mb-0">TOTAL ACTIF CIRCULANT</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_II_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">COMPTES DE RÉGULARISATION</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="cca_{{ suffix }}" class="form-label mb-0">Charges constatées d'avance</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-regul-input-{{ suffix }}" name="cca_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="charges_a_repartir_et_frais_etablissement_{{ suffix }}" class="form-label mb-0">Charges à répartir</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-regul-input-{{ suffix }}" name="charges_a_repartir_et_frais_etablissement_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="primes_de_rbt_{{ suffix }}" class="form-label mb-0">Primes de remboursement</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actifc-regul-input-{{ suffix }}" name="primes_de_rbt_{{ suffix }}" value="0"></div>
            </div>

            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_III_{{ suffix }}" class="form-label fw-bold mb-0">TOTAL COMPTES DE RÉGULARISATION</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_III_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <hr class="my-4">
            <div class="row align-items-center bg-light p-3 rounded">
                <div class="col-md-6"><h5 class="mb-0">TOTAL GÉNÉRAL ACTIF</h5></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="general_total_{{ suffix }}" readonly></div>
            </div>
        </div>
    </div>
</div>
