<script>
$(document).ready(function() {
    let accessToken = '{{ access }}';
    const refreshToken = '{{ refresh }}';

    function refreshAccessToken() {
        $.ajax({
            url: "{% url 'token_refresh' %}",
            type: 'POST',
            data: { 'refresh': refreshToken },
            headers: {'X-CSRFToken': '{{ csrf_token }}'},
            success: function(response) {
                accessToken = response.access;
            },
            error: function() {
                console.error("Échec du rafraîchissement automatique du jeton.");
            }
        });
    }
    setInterval(refreshAccessToken, 240000);
    const formatCurrency = (num) => (parseFloat(num || 0)).toLocaleString('fr-FR', { style: 'currency', currency: 'XAF', minimumFractionDigits: 0 });

    // --- LOGIQUE POUR LES FORMULAIRES MULTI-ANNÉES (SAISIE) ---
    function initializePassifCCalculations(suffix) {
        function calculateTotalsForYear() {
            const p = (val) => parseFloat(val) || 0;
            const totalI = p($(`input[name="capital_social_${suffix}"]`).val()) + p($(`input[name="primes_${suffix}"]`).val()) + p($(`input[name="ecarts_de_reevaluation_${suffix}"]`).val()) + p($(`input[name="reserve_${suffix}"]`).val()) + p($(`input[name="report_a_nouveau_${suffix}"]`).val()) + p($(`input[name="resultat_exercice_${suffix}"]`).val()) + p($(`input[name="subv_invest_${suffix}"]`).val()) + p($(`input[name="provision_regl_${suffix}"]`).val());
            const totalII = p($(`input[name="emprunts_${suffix}"]`).val()) + p($(`input[name="dette_credit_bail_contrat_assimile_${suffix}"]`).val()) + p($(`input[name="dettes_financiere_diverses_${suffix}"]`).val()) + p($(`input[name="provision_financiere_risque_charge_${suffix}"]`).val());
            const totalIII = p($(`input[name="dettes_fournisseurs_divers_${suffix}"]`).val()) + p($(`input[name="avance_et_acomptes_recu_${suffix}"]`).val()) + p($(`input[name="dettes_${suffix}"]`).val()) + p($(`input[name="dettes_fiscales_sociales_${suffix}"]`).val()) + p($(`input[name="autres_dettes_${suffix}"]`).val()) + p($(`input[name="banques_credit_escompte_${suffix}"]`).val()) + p($(`input[name="banque_credit_caisse_${suffix}"]`).val()) + p($(`input[name="banques_decouvert_${suffix}"]`).val());
            const totalIV = p($(`input[name="ecart_conversion_passif_${suffix}"]`).val());
            const generalTotal = totalI + totalII + totalIII + totalIV;
            
            $(`#total_I_${suffix}`).val(formatCurrency(totalI));
            $(`#total_II_${suffix}`).val(formatCurrency(totalII));
            $(`#total_III_${suffix}`).val(formatCurrency(totalIII));
            $(`#total_IV_${suffix}`).val(formatCurrency(totalIV));
            $(`#general_total_${suffix}`).val(formatCurrency(generalTotal));
        }
        $(`#collapsePassifC${suffix.toUpperCase()}`).on('input', 'input[type="number"]', calculateTotalsForYear);
        calculateTotalsForYear();
    }
    ['n', 'n1', 'n2'].forEach(suffix => initializePassifCCalculations(suffix));

    // --- LOGIQUE POUR LA SOUMISSION ET LES MODALS (inchangée) ---
    $('#form-passifs-c-multi-annee').on('submit', function(e) {
        e.preventDefault();
        const form = $(this), btn = $('#btn-submit-form-passifc'), originalText = btn.html();
        $.ajax({
            url: "{% url 'add-multi-year-passif-c' %}",
            type: 'POST', data: form.serialize(),
            headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Authorization': `Bearer ${accessToken}` },
            beforeSend: () => btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span>...'),
            success: () => Swal.fire({ icon: 'success', title: 'Succès !', text: 'Passifs enregistrés.' }).then(() => window.location.reload()),
            error: () => Swal.fire({ icon: 'error', title: 'Erreur', text: 'Veuillez vérifier les données saisies.' }),
            complete: () => btn.prop('disabled', false).html(originalText)
        });
    });
    
    // LOGIQUE DU MODAL DE VUE (inchangée)
    $('#listing-passifs-c-pane').on('click', '.btn-view-passifc', function() {
        const passifId = $(this).data('passif-id');
        const loader = $('#modal-passifc-loader'), content = $('#passifc-details-content');
        loader.show(); content.hide();
        $.ajax({
            url: `{% url 'get-passif-c' 0 %}`.replace('0', passifId),
            headers: { 'Authorization': `Bearer ${accessToken}` },
            success: function(data) {
                $('#modal-passifc-acheteur').text(data.acheteur.nom);
                $('#modal-passifc-annee').text(data.annee.annee);
                $('#total-passifc-I').text(formatCurrency(data.total_I));
                $('#modal-passifc-capital_social').text(formatCurrency(data.capital_social));
                $('#modal-passifc-primes').text(formatCurrency(data.primes));
                $('#modal-passifc-ecarts_de_reevaluation').text(formatCurrency(data.ecarts_de_reevaluation));
                $('#modal-passifc-reserve').text(formatCurrency(data.reserve));
                $('#modal-passifc-report_a_nouveau').text(formatCurrency(data.report_a_nouveau));
                $('#modal-passifc-resultat_exercice').text(formatCurrency(data.resultat_exercice));
                $('#modal-passifc-subv_invest').text(formatCurrency(data.subv_invest));
                $('#modal-passifc-provision_regl').text(formatCurrency(data.provision_regl));

                $('#total-passifc-II').text(formatCurrency(data.total_II));
                $('#modal-passifc-emprunts').text(formatCurrency(data.emprunts));
                $('#modal-passifc-dette_credit_bail_contrat_assimile').text(formatCurrency(data.dette_credit_bail_contrat_assimile));
                $('#modal-passifc-dettes_financiere_diverses').text(formatCurrency(data.dettes_financiere_diverses));
                $('#modal-passifc-provision_financiere_risque_charge').text(formatCurrency(data.provision_financiere_risque_charge));
                
                $('#total-passifc-III').text(formatCurrency(data.total_III));
                $('#modal-passifc-dettes_fournisseurs_divers').text(formatCurrency(data.dettes_fournisseurs_divers));
                $('#modal-passifc-avance_et_acomptes_recu').text(formatCurrency(data.avance_et_acomptes_recu));
                $('#modal-passifc-dettes').text(formatCurrency(data.dettes));
                $('#modal-passifc-dettes_fiscales_sociales').text(formatCurrency(data.dettes_fiscales_sociales));
                $('#modal-passifc-autres_dettes').text(formatCurrency(data.autres_dettes));
                $('#modal-passifc-banques_credit_escompte').text(formatCurrency(data.banques_credit_escompte));
                $('#modal-passifc-banque_credit_caisse').text(formatCurrency(data.banque_credit_caisse));
                $('#modal-passifc-banques_decouvert').text(formatCurrency(data.banques_decouvert));

                $('#total-passifc-IV').text(formatCurrency(data.total_IV));
                $('#modal-passifc-ecart_conversion_passif').text(formatCurrency(data.ecart_conversion_passif));

                $('#total-general-passifc').text(formatCurrency(data.total_general));
                loader.hide();
                content.show();
            },
            error: () => {
                loader.hide();
                content.html('<div class="alert alert-danger">Impossible de charger les détails du passif.</div>').show();
            }
        });
    });

    // --- LOGIQUE POUR LE MODAL DE MODIFICATION ---
    $('#listing-passifs-c-pane').on('click', '.btn-edit-passifc', function() {
        const passifId = $(this).data('passif-id');
        const formContent = $('#edit-passifc-form-content');
        formContent.html('<div class="text-center p-4"><div class="spinner-border"></div></div>');

        function updateEditPassifCTotals() {
            const p = (val) => parseFloat(val) || 0;
            const totalI = p($('#edit_capital_social').val()) + p($('#edit_primes').val()) + p($('#edit_ecarts_de_reevaluation').val()) + p($('#edit_reserve').val()) + p($('#edit_report_a_nouveau').val()) + p($('#edit_resultat_exercice').val()) + p($('#edit_subv_invest').val()) + p($('#edit_provision_regl').val());
            const totalII = p($('#edit_emprunts').val()) + p($('#edit_dette_credit_bail_contrat_assimile').val()) + p($('#edit_dettes_financiere_diverses').val()) + p($('#edit_provision_financiere_risque_charge').val());
            const totalIII = p($('#edit_dettes_fournisseurs_divers').val()) + p($('#edit_avance_et_acomptes_recu').val()) + p($('#edit_dettes').val()) + p($('#edit_dettes_fiscales_sociales').val()) + p($('#edit_autres_dettes').val()) + p($('#edit_banques_credit_escompte').val()) + p($('#edit_banque_credit_caisse').val()) + p($('#edit_banques_decouvert').val());
            const totalIV = p($('#edit_ecart_conversion_passif').val());

            const generalTotal = totalI + totalII + totalIII + totalIV;

            $('#edit_total_I').val(formatCurrency(totalI));
            $('#edit_total_II').val(formatCurrency(totalII));
            $('#edit_total_III').val(formatCurrency(totalIII));
            $('#edit_total_IV').val(formatCurrency(totalIV));
            $('#edit_general_total').val(formatCurrency(generalTotal));
        }
        
        $.ajax({
            url: `{% url 'get-passif-c' 0 %}`.replace('0', passifId),
            headers: { 'Authorization': `Bearer {{ access }}` },
            success: function(data) {
                $('#edit-passifc-id').val(data.id);
                
                let formHtml = `
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="edit_annee" class="form-label">Année</label>
                            <select name="annee" id="edit_annee" class="form-select">
                                {% for annee in annee_list %}<option value="{{ annee.id }}" {% if data.annee.id == annee.id %}selected{% endif %}>{{ annee.annee }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <h5 class="mt-1"><i class="bi bi-person-fill"></i> ${data.acheteur.nom}</h5>
                    <hr>
                    <h4 class="text-primary mt-4">CAPITAUX PROPRES</h4>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_capital_social" class="form-label mb-0">Capital social</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="capital_social" id="edit_capital_social" value="${data.capital_social || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_primes" class="form-label mb-0">Primes</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="primes" id="edit_primes" value="${data.primes || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_ecarts_de_reevaluation" class="form-label mb-0">Écarts de réévaluation</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="ecarts_de_reevaluation" id="edit_ecarts_de_reevaluation" value="${data.ecarts_de_reevaluation || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_reserve" class="form-label mb-0">Réserves</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="reserve" id="edit_reserve" value="${data.reserve || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_report_a_nouveau" class="form-label mb-0">Report à nouveau</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="report_a_nouveau" id="edit_report_a_nouveau" value="${data.report_a_nouveau || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_resultat_exercice" class="form-label mb-0">Résultat de l'exercice</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="resultat_exercice" id="edit_resultat_exercice" value="${data.resultat_exercice || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_subv_invest" class="form-label mb-0">Subventions d'investissement</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="subv_invest" id="edit_subv_invest" value="${data.subv_invest || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_provision_regl" class="form-label mb-0">Provisions réglementées</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="provision_regl" id="edit_provision_regl" value="${data.provision_regl || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_total_I" class="form-label fw-bold mb-0">TOTAL CAPITAUX PROPRES</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_total_I" readonly style="background-color: #e9ecef;"></div></div>
                    <h4 class="text-primary mt-4">DETTES FINANCIÈRES ET RESSOURCES ASSIMILÉES</h4>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_emprunts" class="form-label mb-0">Emprunts</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="emprunts" id="edit_emprunts" value="${data.emprunts || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_dette_credit_bail_contrat_assimile" class="form-label mb-0">Dettes de crédit-bail</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="dette_credit_bail_contrat_assimile" id="edit_dette_credit_bail_contrat_assimile" value="${data.dette_credit_bail_contrat_assimile || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_dettes_financiere_diverses" class="form-label mb-0">Dettes financières diverses</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="dettes_financiere_diverses" id="edit_dettes_financiere_diverses" value="${data.dettes_financiere_diverses || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_provision_financiere_risque_charge" class="form-label mb-0">Provisions financières</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="provision_financiere_risque_charge" id="edit_provision_financiere_risque_charge" value="${data.provision_financiere_risque_charge || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_total_II" class="form-label fw-bold mb-0">TOTAL DETTES FINANCIÈRES</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_total_II" readonly style="background-color: #e9ecef;"></div></div>
                    <h4 class="text-primary mt-4">PASSIF CIRCULANT</h4>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_dettes_fournisseurs_divers" class="form-label mb-0">Dettes fournisseurs</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="dettes_fournisseurs_divers" id="edit_dettes_fournisseurs_divers" value="${data.dettes_fournisseurs_divers || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_avance_et_acomptes_recu" class="form-label mb-0">Avances & acomptes reçus</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="avance_et_acomptes_recu" id="edit_avance_et_acomptes_recu" value="${data.avance_et_acomptes_recu || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_dettes" class="form-label mb-0">Dettes</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="dettes" id="edit_dettes" value="${data.dettes || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_dettes_fiscales_sociales" class="form-label mb-0">Dettes fiscales & sociales</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="dettes_fiscales_sociales" id="edit_dettes_fiscales_sociales" value="${data.dettes_fiscales_sociales || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_autres_dettes" class="form-label mb-0">Autres dettes</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="autres_dettes" id="edit_autres_dettes" value="${data.autres_dettes || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_banques_credit_escompte" class="form-label mb-0">Banques (crédit d'escompte)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="banques_credit_escompte" id="edit_banques_credit_escompte" value="${data.banques_credit_escompte || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_banque_credit_caisse" class="form-label mb-0">Banques (crédit de caisse)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="banque_credit_caisse" id="edit_banque_credit_caisse" value="${data.banque_credit_caisse || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_banques_decouvert" class="form-label mb-0">Banques (découvert)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="banques_decouvert" id="edit_banques_decouvert" value="${data.banques_decouvert || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_total_III" class="form-label fw-bold mb-0">TOTAL PASSIF CIRCULANT</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_total_III" readonly style="background-color: #e9ecef;"></div></div>
                    <h4 class="text-primary mt-4">COMPTES DE RÉGULARISATION</h4>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_ecart_conversion_passif" class="form-label mb-0">Écarts de conversion</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="ecart_conversion_passif" id="edit_ecart_conversion_passif" value="${data.ecart_conversion_passif || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_total_IV" class="form-label fw-bold mb-0">TOTAL COMPTES DE RÉGULARISATION</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_total_IV" readonly style="background-color: #e9ecef;"></div></div>
                    <hr class="my-4">
                    <div class="row align-items-center bg-light p-3 rounded"><div class="col-md-6"><h5 class="mb-0">TOTAL GÉNÉRAL PASSIF</h5></div><div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="edit_general_total" readonly></div></div>
                `;
                formContent.html(formHtml);
                updateEditPassifCTotals();
                $('#form-edit-passifc').on('input', 'input[type="number"]', updateEditPassifCTotals);
            },
            error: function(xhr) {
                formContent.html('<div class="alert alert-danger">Impossible de charger le formulaire de modification du passif.</div>');
            }
        });
    });

    $('#form-edit-passifc').on('submit', function(e) {
        e.preventDefault();
        const form = $(this), passifId = $('#edit-passifc-id').val(), btn = $('#btn-save-passifc-changes'), originalText = btn.html();
        $.ajax({
            url: `{% url 'edit-passif-c' 0 %}`.replace('0', passifId), type: 'PUT', data: form.serialize(),
            headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Authorization': `Bearer {{ access }}` },
            beforeSend: () => btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span>...'),
            success: () => { $('#modal-edit-passifc').modal('hide'); Swal.fire('Modifié !', 'Le passif a été mis à jour.', 'success').then(() => window.location.reload()); },
            error: () => Swal.fire('Erreur', 'Veuillez vérifier les données.', 'error'),
            complete: () => btn.prop('disabled', false).html(originalText)
        });
    });
});
</script>
