{# partials/actif_fields_compact.html #}

<div class="accordion" id="accordion{{ suffix }}">
    
    <!-- Groupe 1: Immobilisations Incorporelles -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseInc{{ suffix }}">
                Immobilisations Incorporelles
            </button>
        </h2>
        <div id="collapseInc{{ suffix }}" class="accordion-collapse collapse">
            <div class="accordion-body p-2">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">Capital Souscrit Non App</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="capital_souscrit_non_app_{{ suffix }}" 
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Frais Recherche Développement</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="frais_recherche_developpement_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Brevet Licence Logiciels</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="brevet_licence_logiciels_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Fonds Commercial</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="fonds_commercial_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-12">
                        <label class="form-label small">Autres Immobilisations Incorporelles</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="autres_immobilisations_incorporelles_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Groupe 2: Immobilisations Corporelles -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseCorp{{ suffix }}">
                Immobilisations Corporelles
            </button>
        </h2>
        <div id="collapseCorp{{ suffix }}" class="accordion-collapse collapse">
            <div class="accordion-body p-2">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">Terrains</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="terrains_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Constructions</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="constructions_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Matériels et Outils</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="materiels_et_outils_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Matériel de Transport</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="materiel_de_transport_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Autres Immos Corporelles</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="autres_immos_corp_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Immos en Cours</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="immos_en_cours_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-12">
                        <label class="form-label small">Avances et Acomptes</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="avances_et_acptes_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Groupe 3: Immobilisations Financières -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseFin{{ suffix }}">
                Immobilisations Financières
            </button>
        </h2>
        <div id="collapseFin{{ suffix }}" class="accordion-collapse collapse">
            <div class="accordion-body p-2">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">Participations</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="participations_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Prêts</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="prets_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-12">
                        <label class="form-label small">Autres</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="autres_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Groupe 4: Stocks -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseStocks{{ suffix }}">
                Stocks
            </button>
        </h2>
        <div id="collapseStocks{{ suffix }}" class="accordion-collapse collapse">
            <div class="accordion-body p-2">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">Stocks MP</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="stocks_mp_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Stocks Encours MP</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="stocks_encours_mp_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Stocks PF</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="stocks_pf_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Stocks Encours PF</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="stocks_encours_pf_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Stocks Encours Services</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="stocks_encours_services_{{ suffix }}"
                               step="0.01" min="0">

                    <div class="col-6">

                        <input type="number" class="form-control form-control-sm" 
                               name="stocks_mses_{{ suffix }}"

                    </div>

            </div>
        </div>
    </div>
    
    <!-- Groupe 5: Créances -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseCreances{{ suffix }}">
                Créances
            </button>
        </h2>
        <div id="collapseCreances{{ suffix }}" class="accordion-collapse collapse">
            <div class="accordion-body p-2">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">Avances Acomptes Versées</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="avances_acptes_verses_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Clients et Comptes Rattachés</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="clients_et_cptes_rattaches_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Autres Créances</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="autres_creances_{{ suffix }}"

                    </div>

                        <label class="form-label small">Valeurs à Encaisser</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="valeurs_a_encaisser_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Groupe 6: Disponibilités -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseDispo{{ suffix }}">
                Disponibilités
            </button>
        </h2>
        <div id="collapseDispo{{ suffix }}" class="accordion-collapse collapse">
            <div class="accordion-body p-2">
                <div class="row g-2">
                    <div class="col-12">
                        <label class="form-label small">Banques Chèques Postaux Caisse</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="banques_cheques_postaux_caisse_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Groupe 7: Comptes de Régularisation -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseRegul{{ suffix }}">
                Comptes de Régularisation
            </button>
        </h2>
        <div id="collapseRegul{{ suffix }}" class="accordion-collapse collapse">
            <div class="accordion-body p-2">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">CCA</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="cca_{{ suffix }}"
                               step="0.01" min="0">

                    <div class="col-6">
                        <label class="form-label small">Charges à Répartir et Frais d'Établissement</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="charges_a_repartir_et_frais_etablissement_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Groupe 8: Primes et Autres -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapsePrimes{{ suffix }}">
                Primes et Autres
            </button>
        </h2>
        <div id="collapsePrimes{{ suffix }}" class="accordion-collapse collapse">

                <div class="row g-2">
                    <div class="col-6">

                    <div class="col-6">
                        <label class="form-label small">ENE</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="eene_{{ suffix }}"
                               step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Effectif</label>
                        <input type="number" class="form-control form-control-sm" 
                               name="effectif_{{ suffix }}"
                               step="1" min="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Groupe 9: Provisions et Amortissements -->
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" data-bs-target="#collapseProv{{ suffix }}">

<!-- Prévisualisation rapide (optionnel) -->
<div class="card mt-3">
    <div class="card-header py-2">
        <h6 class="mb-0">Résumé Année {{ suffix|upper }}</h6>
    </div>
    <div class="card-body p-2">
        <div class="row small g-1">
            <div class="col-6">
                <span>Total Incorporels:</span>
                <span id="previewInc{{ suffix }}" class="fw-bold">0</span>
            </div>
            <div class="col-6">
                <span>Total Corporels:</span>
                <span id="previewCorp{{ suffix }}" class="fw-bold">0</span>
            </div>
            <div class="col-6">
                <span>Total Stocks:</span>
                <span id="previewStocks{{ suffix }}" class="fw-bold">0</span>
            </div>
            <div class="col-6">
                <span>Total Créances:</span>
                <span id="previewCreances{{ suffix }}" class="fw-bold">0</span>
            </div>
            <div class="col-12 border-top pt-1 mt-1">
                <span>Total Provisoire:</span>
                <span id="previewTotal{{ suffix }}" class="fw-bold fs-6">0</span>
            </div>
        </div>
    </div>
</div>
