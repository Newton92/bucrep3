{% load i18n %}
<div class="accordion-item">
    <h2 class="accordion-header" id="headingPassifC{{ suffix }}">
        <button class="accordion-button {% if suffix != 'n' %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePassifC{{ suffix }}" aria-expanded="{% if suffix == 'n' %}true{% else %}false{% endif %}" aria-controls="collapsePassifC{{ suffix }}">
            <strong>Passif pour l'année {{ suffix|upper }}</strong>
        </button>
    </h2>
    <div id="collapsePassifC{{ suffix }}" class="accordion-collapse collapse {% if suffix == 'n' %}show{% endif %}" aria-labelledby="headingPassifC{{ suffix }}" data-bs-parent="#accordionPassifsC">
        <div class="accordion-body">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="annee_{{ suffix }}" class="form-label">{% trans "Année" %}</label>
                    <select name="annee_{{ suffix }}" id="annee_passif_{{ suffix }}" class="form-select">
                        <option selected disabled value="">{% trans "Sélectionner..." %}</option>
                        {% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            
            <h5 class="mt-1"><i class="bi bi-person-fill"></i> {{ acheteur.nom }}</h5>
            <hr>

            <h4 class="text-primary mt-4">{% trans "CAPITAUX PROPRES" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="capital_social_{{ suffix }}" class="form-label mb-0">{% trans "Capital social" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="capital_social_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="primes_{{ suffix }}" class="form-label mb-0">{% trans "Primes" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="primes_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="ecarts_de_reevaluation_{{ suffix }}" class="form-label mb-0">{% trans "Écarts de réévaluation" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="ecarts_de_reevaluation_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="reserve_{{ suffix }}" class="form-label mb-0">{% trans "Réserves" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="reserve_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="report_a_nouveau_{{ suffix }}" class="form-label mb-0">{% trans "Report à nouveau" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="report_a_nouveau_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="resultat_exercice_{{ suffix }}" class="form-label mb-0">{% trans "Résultat de l'exercice" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="resultat_exercice_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="subv_invest_{{ suffix }}" class="form-label mb-0">{% trans "Subventions d'investissement" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="subv_invest_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="provision_regl_{{ suffix }}" class="form-label mb-0">{% trans "Provisions réglementées" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-fonds-propres-input-{{ suffix }}" name="provision_regl_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_I_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL CAPITAUX PROPRES" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_I_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">{% trans "DETTES FINANCIÈRES ET RESSOURCES ASSIMILÉES" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="emprunts_{{ suffix }}" class="form-label mb-0">{% trans "Emprunts" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-dettes-long-terme-input-{{ suffix }}" name="emprunts_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="dette_credit_bail_contrat_assimile_{{ suffix }}" class="form-label mb-0">{% trans "Dettes de crédit-bail" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-dettes-long-terme-input-{{ suffix }}" name="dette_credit_bail_contrat_assimile_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="dettes_financiere_diverses_{{ suffix }}" class="form-label mb-0">{% trans "Dettes financières diverses" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-dettes-long-terme-input-{{ suffix }}" name="dettes_financiere_diverses_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="provision_financiere_risque_charge_{{ suffix }}" class="form-label mb-0">{% trans "Provisions financières" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-dettes-long-terme-input-{{ suffix }}" name="provision_financiere_risque_charge_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_II_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL DETTES FINANCIÈRES" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_II_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">{% trans "PASSIF CIRCULANT" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="dettes_fournisseurs_divers_{{ suffix }}" class="form-label mb-0">{% trans "Dettes fournisseurs" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-circulant-input-{{ suffix }}" name="dettes_fournisseurs_divers_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="avance_et_acomptes_recu_{{ suffix }}" class="form-label mb-0">{% trans "Avances & acomptes reçus" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-circulant-input-{{ suffix }}" name="avance_et_acomptes_recu_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="dettes_{{ suffix }}" class="form-label mb-0">{% trans "Dettes" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-circulant-input-{{ suffix }}" name="dettes_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="dettes_fiscales_sociales_{{ suffix }}" class="form-label mb-0">{% trans "Dettes fiscales & sociales" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-circulant-input-{{ suffix }}" name="dettes_fiscales_sociales_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="autres_dettes_{{ suffix }}" class="form-label mb-0">{% trans "Autres dettes" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-circulant-input-{{ suffix }}" name="autres_dettes_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_III_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL PASSIF CIRCULANT" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_III_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">{% trans "TRÉSORERIE PASSIF" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="banques_credit_escompte_{{ suffix }}" class="form-label mb-0">{% trans "Banques (crédit d'escompte)" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-tresorerie-input-{{ suffix }}" name="banques_credit_escompte_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="banque_credit_caisse_{{ suffix }}" class="form-label mb-0">{% trans "Banques (crédit de caisse)" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-tresorerie-input-{{ suffix }}" name="banque_credit_caisse_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="banques_decouvert_{{ suffix }}" class="form-label mb-0">{% trans "Banques (découvert)" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-tresorerie-input-{{ suffix }}" name="banques_decouvert_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_IV_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL TRÉSORERIE PASSIF" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_IV_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">{% trans "COMPTES DE RÉGULARISATION" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="ecart_conversion_passif_{{ suffix }}" class="form-label mb-0">{% trans "Écarts de conversion" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passifc-regul-input-{{ suffix }}" name="ecart_conversion_passif_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_V_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL COMPTES DE RÉGULARISATION" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_V_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <hr class="my-4">
            <div class="row align-items-center bg-light p-3 rounded">
                <div class="col-md-6"><h5 class="mb-0">{% trans "TOTAL GÉNÉRAL PASSIF" %}</h5></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="general_total_{{ suffix }}" readonly></div>
            </div>
        </div>
    </div>
</div>
