{% load i18n %}
<div class="accordion-item">
    <h2 class="accordion-header" id="headingResultatA{{ suffix }}">
        <button class="accordion-button {% if suffix != 'n' %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapseResultatA{{ suffix }}" aria-expanded="{% if suffix == 'n' %}true{% else %}false{% endif %}" aria-controls="collapseResultatA{{ suffix }}">
            <strong>Compte de Résultat pour l'année {{ suffix|upper }}</strong>
        </button>
    </h2>
    <div id="collapseResultatA{{ suffix }}" class="accordion-collapse collapse {% if suffix == 'n' %}show{% endif %}" aria-labelledby="headingResultatA{{ suffix }}" data-bs-parent="#accordionResultatsA">
        <div class="accordion-body">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="annee_resultat_{{ suffix }}" class="form-label">{% trans "Année" %}</label>
                    <select name="annee_{{ suffix }}" id="annee_resultat_{{ suffix }}" class="form-select">
                        <option selected disabled value="">{% trans "Sélectionner..." %}</option>
                        {% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            
            <h5 class="mt-1"><i class="bi bi-person-fill"></i> {{ acheteur.nom }}</h5>
            <hr>

            <h4 class="text-primary mt-4">{% trans "COMPTE DE RÉSULTAT" %}</h4>
            <div class="row align-items-center mb-2"><div class="col-md-6"><label for="produits_activites_ordinaires_{{ suffix }}" class="form-label mb-0">{% trans "Produits des activités ordinaires (+)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-produits-input-{{ suffix }}" name="produits_activites_ordinaires_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-6"><label for="ventes_{{ suffix }}" class="form-label mb-0">{% trans "Ventes (+)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-produits-input-{{ suffix }}" name="ventes_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-6"><label for="charges_exploitation_{{ suffix }}" class="form-label mb-0">{% trans "Charges d'exploitation (-)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-charges-input-{{ suffix }}" name="charges_exploitation_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-6"><label for="marge_brute_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "MARGE BRUTE" %}</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="marge_brute_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="frais_vente_generaux_administratifs_{{ suffix }}" class="form-label mb-0">{% trans "Frais de vente, généraux et administratifs (-)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-charges-input-{{ suffix }}" name="frais_vente_generaux_administratifs_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-6"><label for="resultat_exploitation_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "RÉSULTAT D'EXPLOITATION" %}</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="resultat_exploitation_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="autres_revenus_{{ suffix }}" class="form-label mb-0">{% trans "Autres revenus (+)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-produits-input-{{ suffix }}" name="autres_revenus_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-6"><label for="resultat_avant_interets_impots_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "RÉSULTAT AVANT INTÉRÊTS & IMPÔTS" %}</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="resultat_avant_interets_impots_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="frais_financier_{{ suffix }}" class="form-label mb-0">{% trans "Frais financier (-)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-charges-input-{{ suffix }}" name="frais_financier_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-6"><label for="resultat_avant_impots_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "RÉSULTAT AVANT IMPÔTS" %}</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="resultat_avant_impots_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="charge_impot_sur_revenu_{{ suffix }}" class="form-label mb-0">{% trans "Charge d'impôt sur le revenu (-)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-charges-input-{{ suffix }}" name="charge_impot_sur_revenu_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-6"><label for="resultat_net_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "RÉSULTAT NET" %}</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="resultat_net_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="autres_elements_resultat_global_{{ suffix }}" class="form-label mb-0">{% trans "Autres éléments du résultat global (+ ou -)" %}</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control resultat-a-produits-input-{{ suffix }}" name="autres_elements_resultat_global_{{ suffix }}" value="0"></div></div>
            
            <hr class="my-4">
            <div class="row align-items-center bg-success text-white p-3 rounded">
                <div class="col-md-6"><h5 class="mb-0">{% trans "RÉSULTAT GLOBAL" %}</h5></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="benefices_non_distribues_{{ suffix }}" readonly></div>
            </div>
        </div>
    </div>
</div>
