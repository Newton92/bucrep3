{% load i18n %}
<div class="accordion-item">
    <h2 class="accordion-header" id="headingPassifA{{ suffix }}">
        <button class="accordion-button {% if suffix != 'n' %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePassifA{{ suffix }}" aria-expanded="{% if suffix == 'n' %}true{% else %}false{% endif %}" aria-controls="collapsePassifA{{ suffix }}">
            <strong>Passif pour l'année {{ suffix|upper }}</strong>
        </button>
    </h2>
    <div id="collapsePassifA{{ suffix }}" class="accordion-collapse collapse {% if suffix == 'n' %}show{% endif %}" aria-labelledby="headingPassifA{{ suffix }}" data-bs-parent="#accordionPassifsA">
        <div class="accordion-body">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="annee_passif_{{ suffix }}" class="form-label">{% trans "Année" %}</label>
                    <select name="annee_{{ suffix }}" id="annee_passif_{{ suffix }}" class="form-select">
                        <option selected disabled value="">{% trans "Sélectionner..." %}</option>
                        {% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            
            <h5 class="mt-1"><i class="bi bi-person-fill"></i> {{ acheteur.nom }}</h5>
            <hr>

            <h4 class="text-primary mt-4">{% trans "FONDS PROPRES" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="capital_reserves_{{ suffix }}" class="form-label mb-0">{% trans "Capital et Réserves" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-fonds-propres-input-{{ suffix }}" name="capital_reserves_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="capital_declare_{{ suffix }}" class="form-label mb-0">{% trans "Capital déclaré" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-fonds-propres-input-{{ suffix }}" name="capital_declare_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="benefices_non_distribues_{{ suffix }}" class="form-label mb-0">{% trans "Bénéfices non distribués" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-fonds-propres-input-{{ suffix }}" name="benefices_non_distribues_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_fonds_propres_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL FONDS PROPRES" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_fonds_propres_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">{% trans "PASSIFS NON-COURANTS (LONG TERME)" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="pret_bancaire_{{ suffix }}" class="form-label mb-0">{% trans "Prêt bancaire" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-non-courant-input-{{ suffix }}" name="pret_bancaire_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="compte_courant_administrateurs_{{ suffix }}" class="form-label mb-0">{% trans "Compte courant des administrateurs" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-non-courant-input-{{ suffix }}" name="compte_courant_administrateurs_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_passifs_non_courants_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL PASSIFS NON-COURANTS" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_passifs_non_courants_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">{% trans "PASSIFS COURANTS" %}</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="dettes_commerciales_autres_dettes_{{ suffix }}" class="form-label mb-0">{% trans "Dettes commerciales et autres dettes" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-courant-input-{{ suffix }}" name="dettes_commerciales_autres_dettes_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="decouvert_bancaire_{{ suffix }}" class="form-label mb-0">{% trans "Découvert bancaire" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-courant-input-{{ suffix }}" name="decouvert_bancaire_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="impots_{{ suffix }}" class="form-label mb-0">{% trans "Impôts" %}</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control passif-a-courant-input-{{ suffix }}" name="impots_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_passifs_courants_{{ suffix }}" class="form-label fw-bold mb-0">{% trans "TOTAL PASSIFS COURANTS" %}</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_passifs_courants_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <hr class="my-4">
            <div class="row align-items-center bg-success text-white p-3 rounded">
                <div class="col-md-6"><h5 class="mb-0">{% trans "TOTAL PASSIF" %}</h5></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="total_passif_{{ suffix }}" readonly></div>
            </div>
        </div>
    </div>
</div>
