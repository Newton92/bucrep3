<div class="accordion-item">
    <h2 class="accordion-header" id="headingActifA{{ suffix }}">
        <button class="accordion-button {% if suffix != 'n' %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapseActifA{{ suffix }}" aria-expanded="{% if suffix == 'n' %}true{% else %}false{% endif %}" aria-controls="collapseActifA{{ suffix }}">
            <strong>Actif pour l'année {{ suffix|upper }}</strong>
        </button>
    </h2>
    <div id="collapseActifA{{ suffix }}" class="accordion-collapse collapse {% if suffix == 'n' %}show{% endif %}" aria-labelledby="headingActifA{{ suffix }}" data-bs-parent="#accordionActifsA">
        <div class="accordion-body">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="annee_{{ suffix }}" class="form-label">Année</label>
                    <select name="annee_{{ suffix }}" id="annee_actif_{{ suffix }}" class="form-select">
                        <option selected disabled value="">Sélectionner...</option>
                        {% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            
            <h5 class="mt-1"><i class="bi bi-person-fill"></i> {{ acheteur.nom }}</h5>
            <hr>

            <h4 class="text-primary mt-4">ACTIFS NON-COURANTS (IMMOBILISÉS)</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="biens_installations_equipements_{{ suffix }}" class="form-label mb-0">Biens, installations et équipements</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actif-a-non-courant-input-{{ suffix }}" name="biens_installations_equipements_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_actifs_non_courants_{{ suffix }}" class="form-label fw-bold mb-0">TOTAL ACTIFS NON-COURANTS</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_actifs_non_courants_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <h4 class="text-primary mt-4">ACTIFS COURANTS</h4>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="inventaire_{{ suffix }}" class="form-label mb-0">Inventaire</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actif-a-courant-input-{{ suffix }}" name="inventaire_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="creances_commerciales_autres_creances_{{ suffix }}" class="form-label mb-0">Créances commerciales et autres</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actif-a-courant-input-{{ suffix }}" name="creances_commerciales_autres_creances_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="actif_impots_courant_{{ suffix }}" class="form-label mb-0">Actif d'impôts courant</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actif-a-courant-input-{{ suffix }}" name="actif_impots_courant_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mb-2">
                <div class="col-md-6"><label for="caisses_banques_{{ suffix }}" class="form-label mb-0">Caisse et banques</label></div>
                <div class="col-md-6"><input type="number" step="0.01" class="form-control actif-a-courant-input-{{ suffix }}" name="caisses_banques_{{ suffix }}" value="0"></div>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-md-6"><label for="total_actifs_courants_{{ suffix }}" class="form-label fw-bold mb-0">TOTAL ACTIFS COURANTS</label></div>
                <div class="col-md-6"><input type="text" class="form-control fw-bold" id="total_actifs_courants_{{ suffix }}" readonly style="background-color: #e9ecef;"></div>
            </div>

            <hr class="my-4">
            <div class="row align-items-center bg-success text-white p-3 rounded">
                <div class="col-md-6"><h5 class="mb-0">TOTAL ACTIF</h5></div>
                <div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="total_actif_{{ suffix }}" readonly></div>
            </div>
        </div>
    </div>
</div>
