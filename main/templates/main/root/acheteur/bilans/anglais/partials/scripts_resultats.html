{% load i18n %}
<script>
$(document).ready(function() {
    let accessToken = '{{ access }}';
    const refreshToken = '{{ refresh }}';
    function refreshAccessToken() {
        $.ajax({
            url: "{% url 'token_refresh' %}", type: 'POST', data: { 'refresh': refreshToken }, headers: {'X-CSRFToken': '{{ csrf_token }}'},
            success: function(response) { accessToken = response.access; },
            error: function() { console.error("Échec du rafraîchissement automatique du jeton."); }
        });
    }
    setInterval(refreshAccessToken, 240000);
    const formatCurrency = (num) => (parseFloat(num || 0)).toLocaleString('fr-FR', { style: 'currency', currency: 'XAF', minimumFractionDigits: 0 });

    // --- LOGIQUE POUR LES FORMULAIRES MULTI-ANNÉES (SAISIE) ---
    function initializeResultatACalculations(suffix) {
        function calculateTotalsForYear() {
            const p = (val) => parseFloat(val) || 0;
            const margeBrute = p($(`input[name="ventes_${suffix}"]`).val()) - p($(`input[name="charges_exploitation_${suffix}"]`).val());
            const resultatExploitation = margeBrute - p($(`input[name="frais_vente_generaux_administratifs_${suffix}"]`).val());
            const resultatAvantInteretsImpots = resultatExploitation + p($(`input[name="autres_revenus_${suffix}"]`).val());
            const resultatAvantImpots = resultatAvantInteretsImpots - p($(`input[name="frais_financier_${suffix}"]`).val());
            const resultatNet = resultatAvantImpots - p($(`input[name="charge_impot_sur_revenu_${suffix}"]`).val());
            const beneficesNonDistribues = resultatNet + p($(`input[name="autres_elements_resultat_global_${suffix}"]`).val());
            
            $(`#marge_brute_${suffix}`).val(formatCurrency(margeBrute));
            $(`#resultat_exploitation_${suffix}`).val(formatCurrency(resultatExploitation));
            $(`#resultat_avant_interets_impots_${suffix}`).val(formatCurrency(resultatAvantInteretsImpots));
            $(`#resultat_avant_impots_${suffix}`).val(formatCurrency(resultatAvantImpots));
            $(`#resultat_net_${suffix}`).val(formatCurrency(resultatNet));
            $(`#benefices_non_distribues_${suffix}`).val(formatCurrency(beneficesNonDistribues));
        }
        $(`#collapseResultatA${suffix.toUpperCase()}`).on('input', 'input[type="number"]', calculateTotalsForYear);
        calculateTotalsForYear();
    }
    ['n', 'n1', 'n2'].forEach(suffix => initializeResultatACalculations(suffix));

    $('#form-resultats-a-multi-annee').on('submit', function(e) {
        e.preventDefault();
        const form = $(this), btn = $('#btn-submit-form-resultats'), originalText = btn.html();
        $.ajax({
            url: "{% url 'add-multi-year-resultat-a' %}", type: 'POST', data: form.serialize(),
            headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Authorization': `Bearer ${accessToken}` },
            beforeSend: () => btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span>...'),
            success: () => Swal.fire({ icon: 'success', title: 'Succès !', text: 'Comptes de résultat enregistrés.' }).then(() => window.location.reload()),
            error: () => Swal.fire({ icon: 'error', title: 'Erreur', text: 'Veuillez vérifier les données saisies.' }),
            complete: () => btn.prop('disabled', false).html(originalText)
        });
    });

    // --- LOGIQUE POUR LE MODAL DE VUE ---
    $('#listing-resultats-a-pane').on('click', '.btn-view-resultats', function() {
        const resultatId = $(this).data('resultat-id');
        const loader = $('#modal-resultats-loader'), content = $('#resultats-details-content');
        loader.show(); content.hide();
        $.ajax({
            url: `{% url 'get-resultat-a' 0 %}`.replace('0', resultatId),
            headers: { 'Authorization': `Bearer ${accessToken}` },
            success: function(data) {
                $('#modal-resultats-acheteur').text(data.acheteur.nom);
                $('#modal-resultats-annee').text(data.annee.annee);
                $('#modal-resultats-marge_brute').text(formatCurrency(data.marge_brute));
                $('#modal-resultats-produits_activites_ordinaires').text(formatCurrency(data.produits_activites_ordinaires));
                $('#modal-resultats-ventes').text(formatCurrency(data.ventes));
                $('#modal-resultats-charges_exploitation').text(formatCurrency(data.charges_exploitation));
                $('#modal-resultats-resultat_exploitation').text(formatCurrency(data.resultat_exploitation));
                $('#modal-resultats-frais_vente_generaux_administratifs').text(formatCurrency(data.frais_vente_generaux_administratifs));
                $('#modal-resultats-resultat_avant_interets_impots').text(formatCurrency(data.resultat_avant_interets_impots));
                $('#modal-resultats-autres_revenus').text(formatCurrency(data.autres_revenus));
                $('#modal-resultats-resultat_avant_impots').text(formatCurrency(data.resultat_avant_impots));
                $('#modal-resultats-frais_financier').text(formatCurrency(data.frais_financier));
                $('#modal-resultats-resultat_net').text(formatCurrency(data.resultat_net));
                $('#modal-resultats-charge_impot_sur_revenu').text(formatCurrency(data.charge_impot_sur_revenu));
                $('#modal-resultats-autres_elements_resultat_global').text(formatCurrency(data.autres_elements_resultat_global));
                $('#modal-resultats-benefices_non_distribues').text(formatCurrency(data.benefices_non_distribues));
                loader.hide(); content.show();
            },
            error: () => { loader.hide(); content.html('<div class="alert alert-danger">Impossible de charger les détails.</div>').show(); }
        });
    });

    // --- LOGIQUE POUR LE MODAL DE MODIFICATION ---
    $('#listing-resultats-a-pane').on('click', '.btn-edit-resultats', function() {
        const resultatId = $(this).data('resultat-id');
        const formContent = $('#edit-resultats-form-content');
        formContent.html('<div class="text-center p-4"><div class="spinner-border"></div></div>');

        function updateEditResultatATotals() {
            const p = (val) => parseFloat(val) || 0;
            const margeBrute = p($('#edit_ventes').val()) - p($('#edit_charges_exploitation').val());
            const resultatExploitation = margeBrute - p($('#edit_frais_vente_generaux_administratifs').val());
            const resultatAvantInteretsImpots = resultatExploitation + p($('#edit_autres_revenus').val());
            const resultatAvantImpots = resultatAvantInteretsImpots - p($('#edit_frais_financier').val());
            const resultatNet = resultatAvantImpots - p($('#edit_charge_impot_sur_revenu').val());
            const beneficesNonDistribues = resultatNet + p($('#edit_autres_elements_resultat_global').val());

            $('#edit_marge_brute').val(formatCurrency(margeBrute));
            $('#edit_resultat_exploitation').val(formatCurrency(resultatExploitation));
            $('#edit_resultat_avant_interets_impots').val(formatCurrency(resultatAvantInteretsImpots));
            $('#edit_resultat_avant_impots').val(formatCurrency(resultatAvantImpots));
            $('#edit_resultat_net').val(formatCurrency(resultatNet));
            $('#edit_benefices_non_distribues').val(formatCurrency(beneficesNonDistribues));
        }

        $.ajax({
            url: `{% url 'get-resultat-a' 0 %}`.replace('0', resultatId),
            headers: { 'Authorization': `Bearer ${accessToken}` },
            success: function(data) {
                $('#edit-resultats-id').val(data.id);
                let formHtml = `
                    <div class="row g-3 mb-4"><div class="col-md-6"><label for="edit_annee" class="form-label">Année</label><select name="annee" id="edit_annee" class="form-select">{% for annee in annee_list %}<option value="{{ annee.id }}" {% if data.annee.id == annee.id %}selected{% endif %}>{{ annee.annee }}</option>{% endfor %}</select></div></div>
                    <h5 class="mt-1"><i class="bi bi-person-fill"></i> ${data.acheteur.nom}</h5><hr>
                    <h4 class="text-primary mt-4">COMPTE DE RÉSULTAT</h4>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_produits_activites_ordinaires" class="form-label mb-0">Produits des activités ordinaires (+)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="produits_activites_ordinaires" id="edit_produits_activites_ordinaires" value="${data.produits_activites_ordinaires || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_ventes" class="form-label mb-0">Ventes (+)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="ventes" id="edit_ventes" value="${data.ventes || 0}"></div></div>
                    <div class="row align-items-center mb-2"><div class="col-md-6"><label for="edit_charges_exploitation" class="form-label mb-0">Charges d'exploitation (-)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="charges_exploitation" id="edit_charges_exploitation" value="${data.charges_exploitation || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_marge_brute" class="form-label fw-bold mb-0">MARGE BRUTE</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_marge_brute" readonly style="background-color: #e9ecef;"></div></div>
                    <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="edit_frais_vente_generaux_administratifs" class="form-label mb-0">Frais de vente, généraux et administratifs (-)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="frais_vente_generaux_administratifs" id="edit_frais_vente_generaux_administratifs" value="${data.frais_vente_generaux_administratifs || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_resultat_exploitation" class="form-label fw-bold mb-0">RÉSULTAT D'EXPLOITATION</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_resultat_exploitation" readonly style="background-color: #e9ecef;"></div></div>
                    <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="edit_autres_revenus" class="form-label mb-0">Autres revenus (+)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="autres_revenus" id="edit_autres_revenus" value="${data.autres_revenus || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_resultat_avant_interets_impots" class="form-label fw-bold mb-0">RÉSULTAT AVANT INTÉRÊTS & IMPÔTS</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_resultat_avant_interets_impots" readonly style="background-color: #e9ecef;"></div></div>
                    <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="edit_frais_financier" class="form-label mb-0">Frais financier (-)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="frais_financier" id="edit_frais_financier" value="${data.frais_financier || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_resultat_avant_impots" class="form-label fw-bold mb-0">RÉSULTAT AVANT IMPÔTS</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_resultat_avant_impots" readonly style="background-color: #e9ecef;"></div></div>
                    <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="edit_charge_impot_sur_revenu" class="form-label mb-0">Charge d'impôt sur le revenu (-)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="charge_impot_sur_revenu" id="edit_charge_impot_sur_revenu" value="${data.charge_impot_sur_revenu || 0}"></div></div>
                    <div class="row align-items-center mt-3"><div class="col-md-6"><label for="edit_resultat_net" class="form-label fw-bold mb-0">RÉSULTAT NET</label></div><div class="col-md-6"><input type="text" class="form-control fw-bold" id="edit_resultat_net" readonly style="background-color: #e9ecef;"></div></div>
                    <div class="row align-items-center mb-2 mt-3"><div class="col-md-6"><label for="edit_autres_elements_resultat_global" class="form-label mb-0">Autres éléments du résultat global (+ ou -)</label></div><div class="col-md-6"><input type="number" step="0.01" class="form-control" name="autres_elements_resultat_global" id="edit_autres_elements_resultat_global" value="${data.autres_elements_resultat_global || 0}"></div></div>
                    <hr class="my-4">
                    <div class="row align-items-center bg-success text-white p-3 rounded"><div class="col-md-6"><h5 class="mb-0">RÉSULTAT GLOBAL</h5></div><div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="edit_benefices_non_distribues" readonly></div></div>
                `;
                formContent.html(formHtml);
                $('#form-edit-resultats').on('input', 'input[type="number"]', updateEditResultatATotals);
                updateEditResultatATotals();
            },
            error: function(xhr) { formContent.html('<div class="alert alert-danger">Impossible de charger le formulaire de modification du compte de résultat.</div>'); }
        });
    });

    $('#form-edit-resultats').on('submit', function(e) {
        e.preventDefault();
        const form = $(this), resultatId = $('#edit-resultats-id').val(), btn = $('#btn-save-resultats-changes'), originalText = btn.html();
        $.ajax({
            url: `{% url 'edit-resultat-a' 0 %}`.replace('0', resultatId), type: 'PUT', data: form.serialize(),
            headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Authorization': `Bearer ${accessToken}` },
            beforeSend: () => btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span>...'),
            success: () => { $('#modal-edit-resultats').modal('hide'); Swal.fire('Modifié !', 'Le compte de résultat a été mis à jour.', 'success').then(() => window.location.reload()); },
            error: () => Swal.fire('Erreur', 'Veuillez vérifier les données.', 'error'),
            complete: () => btn.prop('disabled', false).html(originalText)
        });
    });
});
</script>
