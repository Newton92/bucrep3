{% load i18n %}
<div class="accordion-item">
    <h2 class="accordion-header" id="headingResultatS{{ suffix }}">
        <button class="accordion-button {% if suffix != 'n' %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapseResultatS{{ suffix }}" aria-expanded="{% if suffix == 'n' %}true{% else %}false{% endif %}" aria-controls="collapseResultatS{{ suffix }}">
            <strong>Compte de Résultat pour l'année {{ suffix|upper }}</strong>
        </button>
    </h2>
    <div id="collapseResultatS{{ suffix }}" class="accordion-collapse collapse {% if suffix == 'n' %}show{% endif %}" aria-labelledby="headingResultatS{{ suffix }}" data-bs-parent="#accordionResultatsS">
        <div class="accordion-body">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="annee_resultat_{{ suffix }}" class="form-label">{% trans "Année" %}</label>
                    <select name="annee_{{ suffix }}" id="annee_resultat_{{ suffix }}" class="form-select">
                        <option selected disabled value="">{% trans "Sélectionner..." %}</option>
                        {% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <h5 class="mt-1"><i class="bi bi-person-fill"></i> {{ acheteur.nom }}</h5>
            <hr>
            <h4 class="text-primary mt-4">{% trans "PRODUITS DES ACTIVITÉS ORDINAIRES (I)" %}</h4>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Ventes de marchandises A (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="ventes_marchandises_a_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Ventes de produits manufacturés B (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="ventes_produits_manufactures_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Travaux, services vendus C (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="travaux_services_vendus_c_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Produits accessoires D (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="produits_accessoires_d_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">{% trans "CHIFFRE D'AFFAIRES" %}</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="chiffre_affaires_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <div class="row align-items-center mb-2 mt-3"><div class="col-md-8"><label class="form-label mb-0">{% trans "Production stockée (-/+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="production_stockee_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Production Immobilisée (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="production_immobilisee_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Subvention d'exploitation (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="subvention_exploitation_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Autres produits (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="autres_produits_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Transfert de charges d'exploitation (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="transfert_charges_exploitation_{{ suffix }}" value="0"></div></div>
            <h4 class="text-primary mt-4">{% trans "CHARGES DES ACTIVITÉS ORDINAIRES (II)" %}</h4>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Achats de marchandises (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="achats_marchandises_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Variation des stocks de marchandises (-/+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="variation_stock_marchandises_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Achats de matières premières (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="achats_matieres_premieres_fournitures_connexes_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Variation des stocks de matières premières (-/+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="variation_stock_matieres_premieres_fournitures_connexes_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Autres achats (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="autres_achats_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Variation des stocks d'autres fournitures (-/+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="variation_stock_autres_fournitures_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Transport (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="transport_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Services extérieurs (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="services_exterieurs_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Impôts et taxes (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="impots_taxes_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Autres dépenses (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="autres_depenses_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Frais de personnel (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="frais_personnel_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">{% trans "VALEUR AJOUTÉE" %}</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="valeur_ajoutee_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <hr>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Reprises de dépréciations, amortissements, provisions et pertes de valeur (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-input-{{ suffix }}" name="reprise_depreciations_amortissements_provision_pertes_valeurs_p_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Reprises de dépréciations, amortissements, provisions et pertes de valeur (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-input-{{ suffix }}" name="reprise_depreciations_amortissements_provision_pertes_valeurs_m_{{ suffix }}" value="0"></div></div>
            <h4 class="text-primary mt-4">{% trans "RÉSULTAT FINANCIER" %}</h4>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Produits financiers et assimilés (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-fin-input-{{ suffix }}" name="produits_financiers_assimiles_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Reprises sur provisions et pertes de valeur (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-fin-input-{{ suffix }}" name="reprise_provision_perte_valeur_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Transfert de charges financières (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-fin-input-{{ suffix }}" name="transfert_charges_financieres_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Charges financières et assimilées (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-fin-input-{{ suffix }}" name="charges_financieres_assimilees_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Dotations aux provisions et dépréciations financières (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-fin-input-{{ suffix }}" name="dotations_provisions_depreciations_financieres_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">{% trans "RÉSULTAT FINANCIER" %}</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="resultat_financier_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <h4 class="text-primary mt-4">{% trans "RÉSULTAT DES ACTIVITÉS ORDINAIRES" %}</h4>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Produits des cessions d'immobilisations (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-hao-input-{{ suffix }}" name="produits_cession_immobilisations_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Autres produits HAO (+)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-prods-hao-input-{{ suffix }}" name="autres_produits_hao_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Valeur comptable des cessions d'actifs immobilisés (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-hao-input-{{ suffix }}" name="valeur_comptable_cessions_actifs_immobilises_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Autres charges HAO (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-charges-hao-input-{{ suffix }}" name="autres_charges_hao_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">{% trans "RÉSULTAT DES ACTIVITÉS ORDINAIRES (XE + XF)" %}</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="resultat_activites_ordinaires_{{ suffix }}" readonly style="background-color: #e9ecef;"></div></div>
            <div class="row align-items-center mb-2 mt-3"><div class="col-md-8"><label class="form-label mb-0">{% trans "Participation des travailleurs (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-final-input-{{ suffix }}" name="participation_travailleurs_{{ suffix }}" value="0"></div></div>
            <div class="row align-items-center mb-2"><div class="col-md-8"><label class="form-label mb-0">{% trans "Charge d'impôt sur le revenu (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control resultat-s-final-input-{{ suffix }}" name="charge_impot_revenu_{{ suffix }}" value="0"></div></div>
            <hr class="my-4">
            <div class="row align-items-center bg-success text-white p-3 rounded"><div class="col-md-6"><h5 class="mb-0">{% trans "RÉSULTAT NET DE L'EXERCICE" %}</h5></div><div class="col-md-6"><input type="text" class="form-control form-control-lg fw-bold text-success" id="resultat_net_exercice_{{ suffix }}" readonly></div></div>
        </div>
    </div>
</div>
