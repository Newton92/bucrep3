<div class="row g-3 mb-4">
    <div class="col-md-4"><label for="type_bilan_depense_{{ suffix }}" class="form-label">Type</label><select name="type_bilan_{{ suffix }}" id="type_bilan_depense_{{ suffix }}" class="form-select expense-type-bilan-select" data-suffix="{{ suffix }}"><option selected disabled value="">Sélectionner...</option><option value="annuel">Annuel</option><option value="semestriel">Semestriel</option></select></div>
    <div class="col-md-4"><label for="annee_depense_{{ suffix }}" class="form-label">Année</label><select name="annee_{{ suffix }}" id="annee_depense_{{ suffix }}" class="form-select"><option selected disabled value="">Sélectionner...</option>{% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label for="semestre_depense_{{ suffix }}" class="form-label">Semestre</label><select name="semestre_{{ suffix }}" id="semestre_depense_{{ suffix }}" class="form-select" disabled><option selected disabled value="">Sélectionner...</option><option value="1">1er semestre</option><option value="2">2e semestre</option></select></div>
</div>
<hr>

<h4 class="text-primary mt-4">Charges d'Exploitation Bancaire</h4>
<h6 class="text-muted mt-3 mb-2">Intérêts et charges assimilées</h6>
<div class="row mb-2"><div class="col-md-8"><label for="interet_charges_assimilee_dette_interbancaire_{{ suffix }}" class="form-label mb-0">Sur dettes interbancaires</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="interet_charges_assimilee_dette_interbancaire_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="interet_charge_assimilee_dette_clientele_{{ suffix }}" class="form-label mb-0">Sur dettes clientèle</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="interet_charge_assimilee_dette_clientele_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="interet_charge_assimilee_titre_creance_{{ suffix }}" class="form-label mb-0">Sur titres de créances</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="interet_charge_assimilee_titre_creance_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="chargesc_compte_bloque_dactionnaire_emprunt_sub_{{ suffix }}" class="form-label mb-0">Sur comptes bloqués et emprunts subordonnés</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="chargesc_compte_bloque_dactionnaire_emprunt_sub_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="autres_interets_charges_assimilee_{{ suffix }}" class="form-label mb-0">Autres intérêts et charges</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="autres_interets_charges_assimilee_{{ suffix }}" value="0"></div></div>

<h6 class="text-muted mt-3 mb-2">Charges sur opérations financières</h6>
<div class="row mb-2"><div class="col-md-8"><label for="commissions_{{ suffix }}" class="form-label mb-0">Commissions (charges)</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="commissions_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="charges_sur_op_credit_bail_assimile_{{ suffix }}" class="form-label mb-0">Sur opérations de crédit-bail</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="charges_sur_op_credit_bail_assimile_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="charges_sur_titre_placement_{{ suffix }}" class="form-label mb-0">Sur titres de placement</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="charges_sur_titre_placement_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="charges_sur_operation_change_{{ suffix }}" class="form-label mb-0">Sur opérations de change</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="charges_sur_operation_change_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="charges_sur_operation_hors_bilan_{{ suffix }}" class="form-label mb-0">Sur opérations hors bilan</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-exploitation-input-{{ suffix }}" name="charges_sur_operation_hors_bilan_{{ suffix }}" value="0"></div></div>
<div class="row mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">TOTAL CHARGES D'EXPLOITATION BANCAIRE</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="total_exploitation_{{ suffix }}" readonly></div></div>


<h4 class="text-primary mt-4">Frais Généraux</h4>
<div class="row mb-2"><div class="col-md-8"><label for="frais_personnel_{{ suffix }}" class="form-label mb-0">Frais de personnel</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-frais-generaux-input-{{ suffix }}" name="frais_personnel_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="autres_frais_generaux_{{ suffix }}" class="form-label mb-0">Autres frais généraux</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-frais-generaux-input-{{ suffix }}" name="autres_frais_generaux_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="frais_divers_exploitation_bancaire_{{ suffix }}" class="form-label mb-0">Frais divers d'exploitation</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-frais-generaux-input-{{ suffix }}" name="frais_divers_exploitation_bancaire_{{ suffix }}" value="0"></div></div>
<div class="row mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">TOTAL FRAIS GÉNÉRAUX</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="total_frais_generaux_{{ suffix }}" readonly></div></div>

<h4 class="text-primary mt-4">Dotations, Amortissements et Pertes</h4>
<div class="row mb-2"><div class="col-md-8"><label for="dotations_amortissement_provision_immobilisation_{{ suffix }}" class="form-label mb-0">Dotations aux amortissements et provisions</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-dotations-input-{{ suffix }}" name="dotations_amortissement_provision_immobilisation_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="solde_perte_creance_hors_bilan_{{ suffix }}" class="form-label mb-0">Pertes sur créances</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-dotations-input-{{ suffix }}" name="solde_perte_creance_hors_bilan_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="excedent_dotation_reprises_fonds_pour_risque_bancaire_generaux_{{ suffix }}" class="form-label mb-0">Excédent dotations sur reprises (FRBG)</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-dotations-input-{{ suffix }}" name="excedent_dotation_reprises_fonds_pour_risque_bancaire_generaux_{{ suffix }}" value="0"></div></div>
<div class="row mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">TOTAL DOTATIONS ET PERTES</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="total_dotations_{{ suffix }}" readonly></div></div>

<h4 class="text-primary mt-4">Autres Charges</h4>
<div class="row mb-2"><div class="col-md-8"><label for="charges_exceptionnelle_{{ suffix }}" class="form-label mb-0">Charges exceptionnelles</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-autres-input-{{ suffix }}" name="charges_exceptionnelle_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="pertes_exercice_anterieurs_{{ suffix }}" class="form-label mb-0">Pertes sur exercices antérieurs</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-autres-input-{{ suffix }}" name="pertes_exercice_anterieurs_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="impot_sur_revenu_{{ suffix }}" class="form-label mb-0">Impôts sur le revenu</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control expense-autres-input-{{ suffix }}" name="impot_sur_revenu_{{ suffix }}" value="0"></div></div>

<hr class="my-4">
<div class="row align-items-center bg-light p-3 rounded">
    <div class="col-md-8"><h5 class="mb-0">TOTAL DES DÉPENSES</h5></div>
    <div class="col-md-4"><input type="text" class="form-control form-control-lg fw-bold text-danger" id="total_depenses_{{ suffix }}" readonly></div>
</div>
