{% load i18n %}
<div class="row g-3 mb-4">
    <div class="col-md-4"><label for="type_bilan_produit_{{ suffix }}" class="form-label">{% trans "Type" %}</label><select name="type_bilan_{{ suffix }}" id="type_bilan_produit_{{ suffix }}" class="form-select product-type-bilan-select" data-suffix="{{ suffix }}"><option selected disabled value="">{% trans "Sélectionner..." %}</option><option value="annuel">{% trans "Annuel" %}</option><option value="semestriel">{% trans "Semestriel" %}</option></select></div>
    <div class="col-md-4"><label for="annee_produit_{{ suffix }}" class="form-label">{% trans "Année" %}</label><select name="annee_{{ suffix }}" id="annee_produit_{{ suffix }}" class="form-select"><option selected disabled value="">{% trans "Sélectionner..." %}</option>{% for annee in annee_list %}<option value="{{ annee.id }}">{{ annee.annee }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label for="semestre_produit_{{ suffix }}" class="form-label">{% trans "Semestre" %}</label><select name="semestre_{{ suffix }}" id="semestre_produit_{{ suffix }}" class="form-select" disabled><option selected disabled value="">{% trans "Sélectionner..." %}</option><option value="1">1er semestre</option><option value="2">2e semestre</option></select></div>
</div>
<hr>

<h4 class="text-primary mt-4">{% trans "Produits d'Exploitation Bancaire" %}</h4>
<h6 class="text-muted mt-3 mb-2">{% trans "Intérêts et produits assimilés" %}</h6>
<div class="row mb-2"><div class="col-md-8"><label for="interets_produit_assimile_sur_pret_avance_interbancaire_{{ suffix }}" class="form-label mb-0">{% trans "Sur prêts et avances interbancaires" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-interets-input-{{ suffix }}" name="interets_produit_assimile_sur_pret_avance_interbancaire_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="ineterets_produit_assimile_pret_avance_clientele_{{ suffix }}" class="form-label mb-0">{% trans "Sur prêts et avances à la clientèle" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-interets-input-{{ suffix }}" name="ineterets_produit_assimile_pret_avance_clientele_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="interet_produit_sur_titre_dinvestissement_{{ suffix }}" class="form-label mb-0">{% trans "Sur titres d'investissement" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-interets-input-{{ suffix }}" name="interet_produit_sur_titre_dinvestissement_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="autres_interets_produits_assimiles_{{ suffix }}" class="form-label mb-0">{% trans "Autres intérêts et produits assimilés" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-interets-input-{{ suffix }}" name="autres_interets_produits_assimiles_{{ suffix }}" value="0"></div></div>
<div class="row mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">{% trans "TOTAL INTÉRÊTS ET PRODUITS" %}</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="total_interets_produits_{{ suffix }}" readonly></div></div>

<h6 class="text-muted mt-3 mb-2">{% trans "Revenus sur opérations financières" %}</h6>
<div class="row mb-2"><div class="col-md-8"><label for="commissions_{{ suffix }}" class="form-label mb-0">{% trans "Commissions (produits)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-revenus-input-{{ suffix }}" name="commissions_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="revenus_titre_negociable_{{ suffix }}" class="form-label mb-0">{% trans "Revenus de titres négociables" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-revenus-input-{{ suffix }}" name="revenus_titre_negociable_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="dividendes_produits_assimiles_{{ suffix }}" class="form-label mb-0">{% trans "Dividendes et produits assimilés" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-revenus-input-{{ suffix }}" name="dividendes_produits_assimiles_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="revenus_operation_de_change_{{ suffix }}" class="form-label mb-0">{% trans "Revenus d'opérations de change" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-revenus-input-{{ suffix }}" name="revenus_operation_de_change_{{ suffix }}" value="0"></div></div>
<div class="row mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">{% trans "TOTAL REVENUS FINANCIERS" %}</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="total_revenus_financiers_{{ suffix }}" readonly></div></div>

<h4 class="text-primary mt-4">{% trans "Autres Produits" %}</h4>
<div class="row mb-2"><div class="col-md-8"><label for="ventes_marchandises_{{ suffix }}" class="form-label mb-0">{% trans "Ventes de marchandises" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-autres-input-{{ suffix }}" name="ventes_marchandises_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="produit_dexploitation_generale_{{ suffix }}" class="form-label mb-0">{% trans "Produits d'exploitation générale" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-autres-input-{{ suffix }}" name="produit_dexploitation_generale_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="produits_exceptionnels_{{ suffix }}" class="form-label mb-0">{% trans "Produits exceptionnels" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-autres-input-{{ suffix }}" name="produits_exceptionnels_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="benefice_sur_exercice_anterieur_{{ suffix }}" class="form-label mb-0">{% trans "Bénéfices sur exercices antérieurs" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-autres-input-{{ suffix }}" name="benefice_sur_exercice_anterieur_{{ suffix }}" value="0"></div></div>
<div class="row mb-2"><div class="col-md-8"><label for="perte_{{ suffix }}" class="form-label mb-0">{% trans "Pertes (-)" %}</label></div><div class="col-md-4"><input type="number" step="0.01" class="form-control product-autres-input-{{ suffix }}" name="perte_{{ suffix }}" value="0"></div></div>
<div class="row mt-3"><div class="col-md-8"><label class="form-label fw-bold mb-0">{% trans "TOTAL AUTRES PRODUITS" %}</label></div><div class="col-md-4"><input type="text" class="form-control fw-bold" id="total_autres_produits_{{ suffix }}" readonly></div></div>


<hr class="my-4">
<div class="row align-items-center bg-light p-3 rounded">
    <div class="col-md-8"><h5 class="mb-0">{% trans "TOTAL DES PRODUITS" %}</h5></div>
    <div class="col-md-4"><input type="text" class="form-control form-control-lg fw-bold text-success" id="total_produits_{{ suffix }}" readonly></div>
</div>
