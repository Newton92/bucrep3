{% load i18n %}
<div class="bilan-classique-content" style="padding: 10px;">

    <div class="row">
        <div class="col-12">
            <h5 class="text-primary mb-3">
                <i class="fas fa-balance-scale me-2"></i>{% trans "Bilan Classique" %}
            </h5>
            
            <form id="classiqueForm">
                {% csrf_token %}
                <input type="hidden" id="acheteurId" value="{{ id_acheteur }}">
                
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="classique-anneeN" class="form-label">{% trans "Année N (Courante)" %}</label>
                        <select class="form-select" id="classique-anneeN" required>
                            <option value="">{% trans "Sélectionner..." %}</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="classique-anneeN1" class="form-label">Année N-1</label>
                        <select class="form-select" id="classique-anneeN1" required>
                            <option value="">{% trans "Sélectionner..." %}</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="classique-anneeN2" class="form-label">Année N-2</label>
                        <select class="form-select" id="classique-anneeN2" required>
                            <option value="">{% trans "Sélectionner..." %}</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <button type="button" class="btn btn-primary me-2" onclick="calculateScoreClassique()" id="classique-btnCalculate">
                            <i class="fas fa-calculator"></i> {% trans "Calculer le Score ACREMAC" %}
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="autoFillYears('classique')">
                            <i class="fas fa-magic"></i> {% trans "Remplir Automatiquement" %}
                        </button>
                    </div>
                </div>
            </form>
            
            <div class="mt-3">
                <small class="text-muted">
                    <i class="fas fa-info-circle me-1"></i>
                    Le bilan classique suit le plan comptable général avec une structure traditionnelle Actif/Passif.
                </small>
            </div>
        </div>
    </div>


</div>
