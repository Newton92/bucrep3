{% load i18n %}
{% if prev or next %}
<div class="acheteur-page-nav d-flex align-items-center gap-1">
    {% if prev %}
    <a href="{{ prev.url }}" class="btn btn-sm btn-outline-light page-nav-btn" title="{{ prev.label }}">
        <i class="fas fa-chevron-left"></i>
        <span class="page-nav-label d-none d-lg-inline ms-1">{{ prev.label }}</span>
    </a>
    {% endif %}
    {% if next %}
    <a href="{{ next.url }}" class="btn btn-sm btn-outline-light page-nav-btn" title="{{ next.label }}">
        <span class="page-nav-label d-none d-lg-inline me-1">{{ next.label }}</span>
        <i class="fas fa-chevron-right"></i>
    </a>
    {% endif %}
</div>
{% endif %}
