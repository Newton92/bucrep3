{% load i18n %}
<div class="mb-2">
    <label class="form-label small fw-semibold">{% trans "Nom du compte" %}</label>
    <input type="text" class="form-control form-control-sm" id="{{ prefix }}ImapName"
           placeholder="{% trans "Ex: Boîte principale, Demandes clients…" %}">
</div>
<div class="row g-2 mb-2">
    <div class="col-8">
        <label class="form-label small fw-semibold">{% trans "Hôte IMAP" %} *</label>
        <input type="text" class="form-control form-control-sm" id="{{ prefix }}ImapHost"
               placeholder="imap.example.com">
    </div>
    <div class="col-4">
        <label class="form-label small fw-semibold">{% trans "Port" %}</label>
        <input type="number" class="form-control form-control-sm" id="{{ prefix }}ImapPort" value="993">
    </div>
</div>
<div class="row g-2 mb-2">
    <div class="col-8">
        <label class="form-label small fw-semibold">{% trans "Utilisateur (email)" %} *</label>
        <input type="text" class="form-control form-control-sm" id="{{ prefix }}ImapUser"
               placeholder="contact@bucrep.net">
    </div>
    <div class="col-4">
        <label class="form-label small fw-semibold">{% trans "Boîte" %}</label>
        <input type="text" class="form-control form-control-sm" id="{{ prefix }}ImapMailbox" value="INBOX">
    </div>
</div>
<div class="mb-2">
    <label class="form-label small fw-semibold">{% trans "Mot de passe" %}</label>
    <input type="password" class="form-control form-control-sm" id="{{ prefix }}ImapPassword"
           placeholder="{% trans "Laisser vide pour conserver l'actuel" %}">
</div>
<div class="d-flex align-items-center gap-4 mt-1">
    <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="{{ prefix }}ImapSsl" checked>
        <label class="form-check-label small" for="{{ prefix }}ImapSsl">SSL/TLS</label>
    </div>
    <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="{{ prefix }}ImapActive" checked>
        <label class="form-check-label small" for="{{ prefix }}ImapActive">{% trans "Actif" %}</label>
    </div>
</div>
