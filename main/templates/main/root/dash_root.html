{% extends 'main/root/base.html' %}

{% load i18n %}
{% load static %}




{% block css %}{% endblock %}


{% block body %}


<!-- Title START -->
<div class="row">
    <div class="col-12">
        <h3 class="fs-4 mb-0"><i class="bi bi-house fa-fw me-1"></i>Dashboard Root</h3>
    </div>
</div>
<!-- Title END -->

<!-- Counter START -->
<div class="row g-4">
    <!-- Counter item -->
    <div class="col-sm-6 col-xl-4">
        <div class="card card-body border">
            <div class="d-flex align-items-center">
                <!-- Icon -->
                <div class="icon-xl bg-success rounded-3 text-white">
                    <i class="bi bi-bag"></i>
                </div>
                <!-- Content -->
                <div class="ms-3">
                    <h4>0</h4>
                    <span>Commandes</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Counter item -->
    <div class="col-sm-6 col-xl-4">
        <div class="card card-body border">
            <div class="d-flex align-items-center">
                <!-- Icon -->
                <div class="icon-xl bg-info rounded-3 text-white">
                    <i class="bi bi-handbag"></i>
                </div>
                <!-- Content -->
                <div class="ms-3">
                    <h4>0</h4>
                    <span>Acheteurs</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Counter item -->
    <div class="col-sm-6 col-xl-4">
        <div class="card card-body border">
            <div class="d-flex align-items-center">
                <!-- Icon -->
                <div class="icon-xl bg-warning rounded-3 text-white">
                    <i class="bi bi-incognito"></i>
                </div>
                <!-- Content -->
                <div class="ms-3">
                    <h4>0</h4>
                    <span>Alertes</span>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Counter END -->

<!-- Graph START -->
<div class="row g-4">
    <!-- Booking Chart START -->
    <div class="col-lg-12 col-xl-12">
        <!-- Chart START -->
        <div class="card border h-100">
            <!-- Card header -->
            <div class="card-header border-bottom">
                <h5 class="card-header-title">Evolution des Commandes (2024)</h5>
            </div>
            <!-- Card body -->
            <div class="card-body">
                <!-- Apex chart -->
                <div id="apexChartTrafficStats" class="mt-2"></div>
            </div>
        </div>
        <!-- Chart END -->
    </div>
    <!-- Booking Chart END -->

    <!-- Booking graph START -->
    <div class="col-lg-6">
        <div class="card border h-100">

            <!-- Card header -->
            <div class="card-header border-bottom d-flex justify-content-between align-items-center">
                <h5 class="card-header-title">Acheteurs</h5>
                <a href="#" class="btn btn-link p-0 mb-0"></a>
            </div>

            <!-- Card body START -->
            <div class="card-body p-3">
                <!-- Chart -->
                <div class="col-sm-6 mx-auto">
                    <div class="d-flex justify-content-center" id="ChartTrafficViews"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Booking graph END -->

    <!-- Booking graph START -->
    <div class="col-lg-6">
        <div class="card shadow h-100">
            <!-- Card header -->
            <div class="card-header border-bottom">
                <h5 class="card-header-title">Alertes</h5>
            </div>

            <!-- Card body START -->
            <div class="card-body p-3">
                <!-- Chart -->
                <div class="col-sm-6 mx-auto">
                    <div class="d-flex justify-content-center" id="ChartTrafficRooms"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Booking graph END -->

</div>
<!-- Graph END -->



{% endblock %}


{% block scripts %}{% endblock %}
