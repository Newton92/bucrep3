server {
    listen 80;
    server_name preprod.bucrep3.acremac.net www.preprod.bucrep3.acremac.net;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /app/static/;
    }
}
