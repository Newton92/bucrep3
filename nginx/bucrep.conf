# ===========================================================================
# BUCREP — Configuration Nginx
# Serveur : 107.172.88.238
# Site public  : bucrep.net  (vitrine)
# Espace privé : application.bucrep.net  (dashboard / API)
# ===========================================================================

upstream django {
    server web:8000;
}

# ---------------------------------------------------------------------------
# Redirection HTTP → HTTPS (tous les domaines)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name bucrep.net www.bucrep.net application.bucrep.net;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# SITE PUBLIC — bucrep.net / www.bucrep.net  (vitrine SaaS)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name bucrep.net www.bucrep.net;

    ssl_certificate     /etc/letsencrypt/live/bucrep.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bucrep.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Fichiers statiques servis directement par Nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/main/media/;
        expires 7d;
    }

    # Tout le reste → Django (Host: bucrep.net pour le middleware de ségrégation)
    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              bucrep.net;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ---------------------------------------------------------------------------
# ESPACE PRIVÉ — application.bucrep.net  (dashboard + API)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name application.bucrep.net;

    ssl_certificate     /etc/letsencrypt/live/application.bucrep.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/application.bucrep.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/main/media/;
        expires 7d;
    }

    # Tout le reste → Django (Host: application.bucrep.net)
    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              application.bucrep.net;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
