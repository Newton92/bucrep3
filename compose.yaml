services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=bucrep'
      - 'POSTGRES_PASSWORD=bucrep'
      - 'POSTGRES_USER=bucrep'
    ports:
      - '5433:5432'
    volumes:
      - ./db/initdb.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  app:
    build: .
    command: bash entrypoint.sh
    volumes:
      - .:/app
    ports:
      - '8007:8000'
    depends_on:
      postgres:
        condition: service_healthy


